<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ultimate Soccer Deluxe AI</title>
<style>
*{margin:0;box-sizing:border-box}body{overflow:hidden;background:#111}
#game{position:relative;width:100vw;height:100vh;background:repeating-linear-gradient(90deg,#1b8a3d 0 120px,#2ca84c 120px 240px)}
.line{position:absolute;background:#fff}.v{left:50%;top:5px;bottom:5px;width:4px}.b{left:5px;right:5px;top:5px;height:4px}.bb{left:5px;right:5px;bottom:5px;height:4px}
.l{top:5px;bottom:5px;left:5px;width:4px}.r{top:5px;bottom:5px;right:5px;width:4px}
.c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:180px;height:180px;border:4px solid #fff;border-radius:50%}
.goal{position:absolute;width:18px;height:180px;background:#fff;top:50%;transform:translateY(-50%)}
#lg{left:5px}#rg{right:5px}
.ent{position:absolute;border-radius:50%}
.blue{background:#1971c2;border:2px solid #fff}
.red{background:#e03131;border:2px solid #fff}
.gk1{background:#7048e8}.gk2{background:#f59f00}
.ball{background:#fff;border:2px solid #000}
#hud{position:absolute;top:10px;left:50%;transform:translateX(-50%);color:#fff;font:700 30px Arial}
</style></head>
<body><div id=game>
<div class="line b"></div><div class="line bb"></div><div class="line l"></div><div class="line r"></div><div class="line v"></div><div class=c></div>
<div id=lg class=goal></div><div id=rg class=goal></div>
<div id=hud>Blue <span id=bs>0</span> - <span id=rs>0</span> Red</div>
<div id=ents></div></div>
<script>
const E=document.getElementById("ents"),bs=bs=document.getElementById("bs"),rs=document.getElementById("rs");
let B=0,R=0,W=()=>innerWidth,H=()=>innerHeight;
const team=[];
function add(cls,x,y,s=44){let d=document.createElement("div");d.className="ent "+cls;d.style.width=s+"px";d.style.height=s+"px";E.appendChild(d);let o={d,x,y,vx:0,vy:0,s};team.push(o);return o;}
let user=add("blue",120,H()/2);
let bd=add("blue",240,H()/2-120),bm=add("blue",320,H()/2),bf=add("blue",240,H()/2+120);
let rd=add("red",W()-280,H()/2-120),rm=add("red",W()-360,H()/2),rf=add("red",W()-280,H()/2+120);
let g1=add("gk1",50,H()/2),g2=add("gk2",W()-90,H()/2);
let ball=document.createElement("div");ball.className="ent ball";ball.style.width="20px";ball.style.height="20px";E.appendChild(ball);
let bx=W()/2,by=H()/2,bvx=0,bvy=0;
let k={};onkeydown=e=>k[e.key.toLowerCase()]=1;onkeyup=e=>k[e.key.toLowerCase()]=0;
function kick(p,pow){let dx=bx-(p.x+p.s/2),dy=by-(p.y+p.s/2),d=Math.hypot(dx,dy);if(d<p.s/2+20){let a=Math.atan2(dy,dx);bvx=Math.cos(a)*pow;bvy=Math.sin(a)*pow;}}
function moveAI(p,tx,ty,spd){p.vx+=(tx-p.x)*spd;p.vy+=(ty-p.y)*spd;p.vx*=.94;p.vy*=.94;p.x+=Math.max(-2.8,Math.min(2.8,p.vx));p.y+=Math.max(-2.8,Math.min(2.8,p.vy));kick(p,8);}
function reset(){bx=W()/2;by=H()/2;bvx=bvy=0;user.x=120;user.y=H()/2;}
function loop(){
if(k.w)user.vy-=.35;if(k.s)user.vy+=.35;if(k.a)user.vx-=.35;if(k.d)user.vx+=.35;
user.vx*=.92;user.vy*=.92;user.x+=Math.max(-4,Math.min(4,user.vx));user.y+=Math.max(-4,Math.min(4,user.vy));
moveAI(bd,bx<W()/2?bx-80:180,by,.012);
moveAI(bm,W()/2-120,by,.012);
moveAI(bf,bx,by,.015);
moveAI(rd,bx>W()/2?bx+80:W()-180,by,.012);
moveAI(rm,W()/2+120,by,.012);
moveAI(rf,bx,by,.015);
g1.y+=(by-g1.y)*.1;g2.y+=(by-g2.y)*.1;kick(g1,10);kick(g2,10);
kick(user,9);
if(k[" "]){let a=Math.atan2(by-user.y,bx-user.x);bvx=Math.cos(a)*12;bvy=Math.sin(a)*12;}
bx+=bvx;by+=bvy;bvx*=.985;bvy*=.985;
let gt=H()/2-90,gb=H()/2+90;
if(bx<18&&by>gt&&by<gb){R++;rs.textContent=R;reset();}
if(bx>W()-38&&by>gt&&by<gb){B++;bs.textContent=B;reset();}
if(by<5){by=5;bvy=Math.abs(bvy)};if(by>H()-25){by=H()-25;bvy=-Math.abs(bvy)}
if(bx<5){bx=5;bvx=Math.abs(bvx)};if(bx>W()-25){bx=W()-25;bvx=-Math.abs(bvx)}
for(let p of team){p.x=Math.max(5,Math.min(W()-p.s-5,p.x));p.y=Math.max(5,Math.min(H()-p.s-5,p.y));
p.d.style.left=p.x+"px";p.d.style.top=p.y+"px";}
ball.style.left=bx+"px";ball.style.top=by+"px";
requestAnimationFrame(loop);}
loop();
</script></body></html>
