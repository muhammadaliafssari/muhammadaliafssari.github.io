<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"> <!-- so it uses normal text -->
<meta name="viewport" content="width=device-width,initial-scale=1.0"> <!-- so that it fits on phone screens-->
<title>Soccer</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; } /* removes the normal spacing from everything */

body { overflow: hidden; background: #111; font-family: Arial; } /* hides scroll bars, dark background */

#game {
  position: relative; /* so like that the children inside can be placed anywhere inside the box */
  width: 100vw;       /* so like the game sttreches to the full with of the screen */
  height: 100vh;      /* so like that the game stretches to the full height of the screen */
  overflow: hidden;   /* chops of that it takes off anything that goes outside */
  background: repeating-linear-gradient(90deg, #1b8a3d 0 120px, #2ca84c 120px 240px); /* the alternating green stripes in the grass */
}

.field-border  { position: absolute; inset: 8px; border: 4px solid rgba(255,255,255,0.85); pointer-events: none; } /* the white box around the field */
.center-line   { position: absolute; left: 50%; top: 8px; bottom: 8px; width: 3px; background: rgba(255,255,255,0.85); pointer-events: none; } /* the white line down the middle */
.center-circle { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
                 width: 220px; height: 220px; border: 3px solid rgba(255,255,255,0.85); border-radius: 50%; pointer-events: none; } /* the circle in the middle of the field */
.goal { position: absolute; top: 50%; transform: translateY(-50%); width: 22px; height: 180px; background: rgba(255,255,255,0.9); pointer-events: none; } /* white goal post rectangle */
.goal-left  { left: 8px; }  /* were the blue team scores */
.goal-right { right: 8px; } /* were the red team scores */

#gameCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; } /* the canvas that covers the whole screen, drawn at the top of the field */

#hud { /* the score at the top */
  position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
  color: #fff; font-size: 26px; font-weight: bold; letter-spacing: 2px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.6); pointer-events: none; white-space: nowrap;
}

#timer { /* the countdown clock */
  position: absolute; top: 52px; left: 50%; transform: translateX(-50%);
  color: #fff; font-size: 20px; font-weight: bold;
  text-shadow: 0 2px 6px rgba(0,0,0,0.5); pointer-events: none;
}

#controls-hint { /* writin at the bottom showing the controls */
  position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.5); font-size: 12px; pointer-events: none; text-align: center; line-height: 1.6;
}

#stamina-p1, #stamina-p2 { /* the thin bars that show how much more you can sprint */
  position: absolute; bottom: 44px; height: 7px; border-radius: 4px;
  background: rgba(255,255,255,0.15); overflow: hidden; pointer-events: none; width: 120px;
}
#stamina-p1 { left: 20px; }   /* the p1 bar on the left side */
#stamina-p2 { right: 20px; }  /* the p2 bar on the right side */
.stamina-fill { height: 100%; border-radius: 4px; transition: width 0.1s; } /* the colored part that fills up */
#stamina-p1 .stamina-fill { background: #4dabf7; } /* the blue for p1 */
#stamina-p2 .stamina-fill { background: #ff6b6b; } /* the red for p2 */

#powerbar { /* the bar that shows how powerful your shot will be */
  position: absolute; bottom: 58px; left: 50%; transform: translateX(-50%);
  width: 140px; height: 10px; border-radius: 5px;
  background: rgba(255,255,255,0.15); overflow: hidden; pointer-events: none;
  display: none; /* the thing that is hidden until you hold the spacebar */
}
#powerbar-fill { height: 100%; border-radius: 5px; background: linear-gradient(90deg,#ffd43b,#ff6b6b); width: 0%; } /* the yellow to red fill */

#goal-splash { /* the big goal screen that pops up */
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  pointer-events: none; opacity: 0; transition: opacity 0.15s; /* the thing that starts invisible, fades in */
}
#goal-text { font-size: 96px; font-weight: 900; letter-spacing: 6px; text-shadow: 0 4px 30px rgba(0,0,0,0.7); color: #fff; } /* the actual goal writing */

#countdown { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0; } /* the 3 2 1 go */
#countdown-text { font-size: 120px; font-weight: 900; color: #fff; text-shadow: 0 4px 30px rgba(0,0,0,0.6); } /* the big countdown number */

#difficulty-screen { /* the menu bar you see before the game starts */
  position: absolute; inset: 0; background: rgba(0,0,0,0.82);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; z-index: 10;
}
#difficulty-screen h1 { color: #fff; font-size: 42px; font-weight: 900; letter-spacing: 3px; margin-bottom: 8px; }
#difficulty-screen p  { color: rgba(255,255,255,0.6); font-size: 15px; margin-bottom: 8px; }
.diff-btn { padding: 14px 48px; font-size: 20px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; letter-spacing: 1px; transition: transform 0.1s, opacity 0.1s; }
.diff-btn:hover { transform: scale(1.05); } /* the buton that gets a little bigger when you hover over it */
.diff-btn.easy   { background: #40c057; color: #fff; } /* green is the easy mode */
.diff-btn.medium { background: #fd7e14; color: #fff; } /* orange is the medium mode */
.diff-btn.hard   { background: #e03131; color: #fff; } /* red is the hard mode */

#p2-label { position: absolute; top: 14px; right: 20px; color: rgba(255,100,100,0.7); font-size: 12px; pointer-events: none; } /* reminder of P2 controls */
</style>
</head>
<body>
<div id="game">
  <div class="field-border"></div>   <!-- the white border around the field -->
  <div class="center-line"></div>    <!-- the line down the middle -->
  <div class="center-circle"></div>  <!-- the circle in the middle -->
  <div class="goal goal-left"></div>  <!-- the blue goal on the left -->
  <div class="goal goal-right"></div> <!-- the red goal on the right -->

  <canvas id="gameCanvas"></canvas> <!-- everything moving is drawn here -->

  <div id="hud">Blue <span id="score-blue">0</span> – <span id="score-red">0</span> Red</div> <!-- scoreboard -->
  <div id="timer">2:00</div>           <!-- the game timer -->
  <div id="p2-label">P2: IJKL + O</div> <!-- tells p2 their keys -->

  <div id="stamina-p1"><div class="stamina-fill" id="sf1"></div></div> <!-- the p1 stamina bar -->
  <div id="stamina-p2"><div class="stamina-fill" id="sf2"></div></div> <!-- the p2 stamina bar -->

  <div id="powerbar"><div id="powerbar-fill"></div></div> <!-- the power shot charge bar -->

  <div id="goal-splash"><div id="goal-text">GOAL!</div></div> <!-- shows goal or winner writin -->
  <div id="countdown"><div id="countdown-text">3</div></div>  <!-- 3 2 1 go countdown -->

  <div id="controls-hint"> <!-- the keyboard controls that are shown at the bottom -->
    P1: WASD move · SPACE charge shot · SHIFT slide tackle<br>
    P2: IJKL move · O charge shot · P slide tackle
  </div>

  <div id="difficulty-screen"> <!-- the difficulty menu shown before each match -->
    <h1>⚽ SOCCER</h1>
    <p>Choose difficulty</p>
    <button class="diff-btn easy"   onclick="startGame('easy')">EASY</button>   <!-- the call startgame with easy -->
    <button class="diff-btn medium" onclick="startGame('medium')">MEDIUM</button>
    <button class="diff-btn hard"   onclick="startGame('hard')">HARD</button>
  </div>
</div>

<script>
// the grab the canvas and get ready to draw on it
const canvas = document.getElementById("gameCanvas");
const ctx    = canvas.getContext("2d"); // ctx is the tool we use to draw shapes

// it makes it the canvas match the window size
function resizeCanvas() { canvas.width = innerWidth; canvas.height = innerHeight; }
resizeCanvas(); // makes it it do it once right away
window.addEventListener("resize", resizeCanvas); // and again whenever the window changes size

const GW = () => innerWidth;  // the shortcut for the screen width
const GH = () => innerHeight; // the shortcut for the screen height

// sets up the audio system so like we can make sounds with code
const AC = new (window.AudioContext || window.webkitAudioContext)();

// plays one beep or tone sound
// freq is how high or low the pitch is, type is what kind of sound, duration is how long
function playTone(freq, type, duration, vol = 0.3, delay = 0) {
  const o = AC.createOscillator(); // this kinda makes it the actual sound
  const g = AC.createGain();       // this kinda controls the volume
  o.connect(g);                    // this kinda hooks the sound into volume
  g.connect(AC.destination);       // this kinda hooks the volume into speakers
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol, AC.currentTime + delay);                            // starts at this kinda volume
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + delay + duration); // the fade out
  o.start(AC.currentTime + delay);
  o.stop(AC.currentTime + delay + duration);
}

function soundKick()        { playTone(180,"sine",0.08,0.4); playTone(90,"sine",0.12,0.2); } // the thud when ball is kicked
function soundGoal()        { [523,659,784,1047].forEach((f,i)=>playTone(f,"sine",0.25,0.5,i*0.12)); playTone(200,"sawtooth",0.6,0.15,0.5); } // the happy goal jingle
function soundWhistle()     { playTone(1200,"sine",0.3,0.4); playTone(1400,"sine",0.2,0.3,0.25); } // referee whistle
function soundTackle()      { playTone(120,"sawtooth",0.12,0.5); } // the sliding tackle thud
function soundPowerup()     { [400,600,800].forEach((f,i)=>playTone(f,"sine",0.15,0.4,i*0.08)); } // the powerup pickup beeps
function soundCountdown(n)  { playTone(n===0?880:660,"sine",0.18,0.5); } // the high beep for go, low for numbers

// the sizes of the things in pixels
const PLAYER_R   = 22;  // this kinda is how wide a player circle is
const BALL_R     = 11;  // this kinda ishow wide the ball is
const GOAL_W     = 22;  // how wide the goal post is
const GOAL_H     = 180; // how tall the goal opening is
const MARGIN     = 8;   // the gap between the field edge and screen edge

const MATCH_SECS     = 120;  // match is 2 minutes long
const STAMINA_MAX    = 100;  // the full sprint energy
const STAMINA_SPRINT = 0.55; // this kinda is how fast stamina drains when sprinting
const STAMINA_RECOVER= 0.22; // this kinda is how fast stamina refills when not sprinting
const SPRINT_MULT    = 1.7;  // this kinda is how much faster you go when sprinting

// this kinda is how hard or fast the ai players are on each difficulty
const DIFF = {
  easy:   { aiAccel: 0.003, aiFric: 0.89, aiKick: 4.5, gkKick: 5,   gkSpeed: 0.05 }, // slow and weak
  medium: { aiAccel: 0.006, aiFric: 0.91, aiKick: 6,   gkKick: 7,   gkSpeed: 0.08 }, // balanced
  hard:   { aiAccel: 0.010, aiFric: 0.93, aiKick: 8,   gkKick: 9,   gkSpeed: 0.12 }, // fast and strong
};

let difficulty = "medium"; // this kinda will get set when you pick a difficulty

// this kinda is your players movement and kick settings
const SPEEDS = {
  userAccel:    0.42,  // this kinda is how fast you speed up
  userMaxSpeed: 5.5,   // the fastest you can move
  userFriction: 0.88,  // this kinda is how fast you slow down (lower = stops faster)
  userKickPow:  9,     // this kinda is how hard a normal kick is
  spaceKickPow: 22,    // this kinda is how hard a fully charged shot is
  ballFriction: 0.984, // thsi is how fast the ball slows down as it rolls
};

// these are the three powerups that show up on the field
const POWERUP_TYPES = [
  { id: "speed",   label: "⚡ SPEED",    color: "#ffd43b", duration: 5000 }, // this kinda makes it you faster for 5 seconds
  { id: "bigball", label: "🔵 BIG BALL", color: "#74c0fc", duration: 6000 }, // this kinda makes it the ball huge for 6 seconds
  { id: "freeze",  label: "❄️ FREEZE GK",color: "#a5d8ff", duration: 5000 }, // this kinda freezes both goalkeepers for 5 seconds
];

// this kinda keeps track of wich keys are held down right now
const keys = {};
document.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true; // this kinda marks this kinda key as pressed
  if([" ","arrowup","arrowdown","arrowleft","arrowright"].includes(e.key.toLowerCase())) e.preventDefault(); // the stop arrow keys from scrolling the page
});
document.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; }); // this kinda marks the key as released

// all the game variables
let players     = [];       // list of every player
let scoreBlue   = 0, scoreRed = 0; // scores for each team
let matchTime   = MATCH_SECS;      // seconds left in the match
let gameRunning = false;    // is the game actively running right now?
let overtime    = false;    // did the game go into overtime?
let frameCount  = 0;        // counts how many frames have happened total
let stuckFrames = 0;        // counts how long the ball has barely moved
let lastBallX   = 0, lastBallY = 0; // where the ball was last frame

// the ball object — x/y is where it realy is, rx/ry is the smoother drawn position
const ball = { x:0, y:0, vx:0, vy:0, rx:0, ry:0, r:BALL_R };

const confetti = []; // list of confetti pieces flying around after a goal

let activePowerups = []; // powerups sitting on the field right now
let powerupEffects = {}; // wich powerup effects are currently active and when they expire
let powerupLabels  = []; // floating text like "⚡ SPEED" that shows when you grab a powerup

let p1Power = 0, p1Charging = false; // how charged P1's shot is (0-100) and if they're holding SPACE
let p2Power = 0, p2Charging = false; // same for P2

let staminaP1 = STAMINA_MAX, staminaP2 = STAMINA_MAX; // current sprint energy for each player

let tackles     = []; // not used yet, saved for later
let matchHistory = []; // keeps the last few match results

// creates one player and adds them to the players list
function createPlayer(x, y, role, team, color, label, isUser=false, isP2=false) {
  const p = {
    x, y,           // real position used for physics
    rx: x, ry: y,   // smoothed position used just for drawing (looks nicer)
    homeX: x, homeY: y, // where this kinda player starts / returns to (mainly for goalkeepers)
    vx: 0, vy: 0,   // speed going left/right and up/down
    role,            // what this kinda player does: "user", "fwd", "gk", or "p2"
    team,            // wich team: "b" for blue or "r" for red
    color,           // the color of their circle
    label,           // the text on their circle like "YOU" or "GK"
    isUser,          // is this kinda the player P1 controls?
    isP2,            // is this kinda the player P2 controls?
    tackling: false, // are they doing a slide tackle right now?
    tackleTimer: 0,  // how many frames are left in the tackle animation
    frozen: false,   // are they frozen by the freeze powerup?
  };
  players.push(p); // add them to the list
  return p;
}

// puts all players on the field at kickoff positions
function spawnPlayers() {
  players = []; // clear old players first
  const cy = GH()/2; // middle of the screen vertically

  // blue team on the left side
  createPlayer(150,      cy, "user","b","#1971c2","YOU", true,  false); // that's you
  createPlayer(320,      cy, "fwd", "b","#1c7ed6","BOT", false, false); // your AI teammate
  createPlayer(55,       cy, "gk",  "b","#7048e8","GK",  false, false); // your goalkeeper

  // red team on the right side
  createPlayer(GW()-320, cy, "fwd", "r","#e03131","BOT", false, false); // enemy AI forward
  createPlayer(GW()-100, cy, "gk",  "r","#f59f00","GK",  false, false); // enemy goalkeeper
  createPlayer(GW()-150, cy, "p2",  "r","#c92a2a","P2",  false, true);  // player 2 (if someone is playing)
}

// browsers block sound until you press a key, so like this kinda turns sound back on
document.addEventListener("keydown", () => { if(AC.state==="suspended") AC.resume(); }, {once:true});

// runs when you click easy, medium, or hard — sets everything up and starts the game
function startGame(diff) {
  difficulty = diff; // save wich difficulty was picked
  document.getElementById("difficulty-screen").style.display = "none"; // hide the menu
  spawnPlayers();    // put players on the field
  resetBall();       // put ball in the center
  scoreBlue = scoreRed = 0; // both scores back to zero
  matchTime = MATCH_SECS;   // timer back to 2 minutes
  overtime  = false;
  gameRunning = false; // wait for countdown to finish before running
  activePowerups = []; // remove any old powerups
  powerupEffects = {}; // clear any active effects
  updateScoreHUD();    // update the score display
  doCountdown(() => {  // show 3 2 1 GO, then...
    gameRunning = true; // start the game
    soundWhistle();     // blow the whistle
    scheduleNextPowerup(); // start spawning powerups
  });
}

// shows the 3 2 1 GO! countdown on screen, then calls cb() when done
function doCountdown(cb) {
  const el  = document.getElementById("countdown");
  const txt = document.getElementById("countdown-text");
  let n = 3;
  el.style.opacity = "1"; // make the overlay visible
  soundCountdown(n);
  txt.textContent = n; // show "3"
  const iv = setInterval(() => {
    n--;
    if (n > 0)       { txt.textContent = n; soundCountdown(n); }       // show 2, then 1
    else if (n === 0){ txt.textContent = "GO!"; soundCountdown(0); }   // show GO!
    else             { clearInterval(iv); el.style.opacity = "0"; cb(); } // hide it and start
  }, 800); // runs every 800 milliseconds
}

// moves ball back to center and clears its speed and trail
function resetBall() {
  ball.x = ball.rx = GW()/2; // center of screen horizontally
  ball.y = ball.ry = GH()/2; // center of screen vertically
  ball.vx = ball.vy = 0;     // not moving
  ball.r = BALL_R;            // reset size (bigball powerup might have made it bigger)
  trail.length = 0;           // clear the motion trail
}

const trail     = []; // stores recent ball positions to draw a trail behind it
const TRAIL_MAX = 28; // how many positions to remember

// saves the ball's current position to the trail list
function updateTrail() {
  trail.unshift({ x: ball.rx, y: ball.ry }); // add to front
  if (trail.length > TRAIL_MAX) trail.pop();  // remove from back if too many
}

// draws the glowing trail behind the ball when it's moving fast
function drawTrail() {
  const speed = Math.hypot(ball.vx, ball.vy); // how fast the ball is going
  if (speed < 0.8) return; // don't bother drawing if the ball is barely moving

  for (let i = trail.length-1; i >= 0; i--) { // draw oldest positions first so like newer ones are on top
    const t     = i / TRAIL_MAX;               // 0 = newest, 1 = oldest
    const alpha = (1-t) * 0.65 * Math.min(speed/4,1); // older = more transparent
    const r     = Math.max(1, ball.r * (1 - t*0.82));  // older = smaller circle
    const red   = Math.round(255*(1-t*0.9));   // color shifts from white to blue as it gets older
    const grn   = Math.round(220*(1-t*0.5));
    ctx.beginPath();
    ctx.arc(trail[i].x, trail[i].y, r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(${red},${grn},255,${alpha.toFixed(3)})`;
    ctx.fill();
  }

  // draw a soft glow at the ball's current spot
  if (trail.length > 0) {
    const g = ctx.createRadialGradient(trail[0].x,trail[0].y,0, trail[0].x,trail[0].y,ball.r*2.5);
    g.addColorStop(0, `rgba(180,230,255,${Math.min(speed/6,0.55).toFixed(3)})`); // bright center
    g.addColorStop(1, "rgba(100,180,255,0)"); // fades to nothing at edges
    ctx.beginPath();
    ctx.arc(trail[0].x, trail[0].y, ball.r*2.5, 0, Math.PI*2);
    ctx.fillStyle = g; ctx.fill();
  }
}

// creates 120 confetti pieces that fly out from a spot (used when a goal is scored)
function spawnConfetti(cx, cy) {
  const COLORS = ["#ffd43b","#ff6b6b","#74c0fc","#a9e34b","#f783ac","#fff"]; // random colors
  for (let i = 0; i < 120; i++) {
    const angle = Math.random()*Math.PI*2; // random direction to fly
    const speed = 2 + Math.random()*8;    // random speed
    confetti.push({
      x: cx, y: cy,
      vx: Math.cos(angle)*speed,      // how fast it moves sideways
      vy: Math.sin(angle)*speed - 4,  // how fast it moves up/down (biased upward)
      w: 6+Math.random()*8,           // random width
      h: 4+Math.random()*5,           // random height
      rot:  Math.random()*Math.PI,    // starting rotation
      rotV: (Math.random()-0.5)*0.3,  // how fast it spins
      color: COLORS[Math.floor(Math.random()*COLORS.length)],
      life: 1,                        // starts fully visible
      decay: 0.012+Math.random()*0.01 // how fast it fades out
    });
  }
}

// moves all confetti pieces and fades them out
function updateConfetti() {
  for (let i = confetti.length-1; i >= 0; i--) {
    const c = confetti[i];
    c.x   += c.vx;   // move sideways
    c.y   += c.vy;   // move up/down
    c.vy  += 0.18;   // gravity pulls it down
    c.vx  *= 0.98;   // air resistance slows it a tiny bit
    c.rot += c.rotV; // spin it
    c.life -= c.decay; // get more transparent
    if (c.life <= 0) confetti.splice(i,1); // remove once fully invisible
  }
}

// draws all the confetti pieces
function drawConfetti() {
  for (const c of confetti) {
    ctx.save();               // remember current drawing settings
    ctx.translate(c.x, c.y); // move to this kinda piece's position
    ctx.rotate(c.rot);        // rotate it
    ctx.globalAlpha = c.life; // set how see-through it is
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h); // draw a small rectangle
    ctx.restore();            // go back to normal drawing settings
  }
  ctx.globalAlpha = 1; // reset transparency so like other drawing isn't affected
}

// schedules a new random powerup to appear on the field every 8-15 seconds
function scheduleNextPowerup() {
  if (!gameRunning) return; // don't schedule if the game stopped
  setTimeout(() => {
    if (!gameRunning) return; // check again in case game ended while waiting
    const type = POWERUP_TYPES[Math.floor(Math.random()*POWERUP_TYPES.length)]; // pick a random powerup
    activePowerups.push({
      x: 150 + Math.random()*(GW()-300), // random spot on the field
      y: 80  + Math.random()*(GH()-160),
      type, pulse: 0 // pulse is used for the bouncing animation
    });
    scheduleNextPowerup(); // schedule the next one
  }, 8000 + Math.random()*7000); // wait 8 to 15 seconds
}

// checks if any player is touching a powerup and collects it
function checkPowerupCollisions() {
  for (let i = activePowerups.length-1; i >= 0; i--) {
    const pu = activePowerups[i];
    for (const p of players) {
      const dist = Math.hypot(p.x - pu.x, p.y - pu.y); // distance between player and powerup
      if (dist < PLAYER_R + 20) { // close enough to grab it
        soundPowerup(); // play pickup sound
        powerupEffects[pu.type.id] = Date.now() + pu.type.duration; // save when it expires
        activePowerups.splice(i,1); // remove it from the field
        powerupLabels.push({ text: pu.type.label, x: pu.x, y: pu.y, life: 1.5 }); // show floating label
        break; // only one player can grab each powerup
      }
    }
  }
}

// draws powerup icons on the field and any floating pickup labels
function drawPowerups() {
  for (const pu of activePowerups) {
    pu.pulse += 0.07; // slowly increase so like it bounces using sin()
    const s = 1 + Math.sin(pu.pulse)*0.12; // pulsing scale (between 0.88 and 1.12)

    ctx.save();
    ctx.translate(pu.x, pu.y);
    ctx.scale(s, s); // apply the pulse
    ctx.beginPath(); ctx.arc(0,0,20,0,Math.PI*2); // draw the circle
    ctx.fillStyle = pu.type.color; ctx.globalAlpha = 0.9; ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke(); // white border
    ctx.globalAlpha = 1;
    ctx.font = "bold 13px Arial"; ctx.textAlign = "center"; ctx.fillStyle = "#222";
    ctx.fillText(pu.type.id==="speed" ? "⚡" : pu.type.id==="bigball" ? "●" : "❄", 0, 5); // draw icon
    ctx.restore();
  }

  // draw floating labels like "⚡ SPEED" that drift upward and fade out
  for (let i = powerupLabels.length-1; i >= 0; i--) {
    const lb = powerupLabels[i];
    lb.y    -= 0.8;  // float upward
    lb.life -= 0.02; // fade out
    if (lb.life <= 0) { powerupLabels.splice(i,1); continue; } // remove when invisible
    ctx.globalAlpha = Math.min(lb.life, 1);
    ctx.font = "bold 18px Arial"; ctx.textAlign = "center"; ctx.fillStyle = "#ffd43b";
    ctx.fillText(lb.text, lb.x, lb.y);
  }
  ctx.globalAlpha = 1;
}

// turns on whatever powerup effects are currently active
function applyPowerupEffects() {
  const now = Date.now();
  ball.r = (powerupEffects.bigball && now < powerupEffects.bigball) ? BALL_R*2.2 : BALL_R; // make ball bigger if bigball active
  for (const p of players) {
    if (p.role === "gk") p.frozen = !!(powerupEffects.freeze && now < powerupEffects.freeze); // freeze goalkeepers if freeze active
  }
}

// kicks the ball away from a player — used for both AI and human
function kickBall(p, power) {
  const dx   = ball.x - p.x; // how far the ball is to the right of the player
  const dy   = ball.y - p.y; // how far the ball is below the player
  const dist = Math.hypot(dx, dy); // total distance between player and ball
  if (dist < PLAYER_R + ball.r + 2) { // close enough to kick
    soundKick();
    const angle = Math.atan2(dy, dx) + (Math.random()-0.5)*0.22; // angle toward ball with a little randomness
    ball.vx = Math.cos(angle) * power; // send ball flying horizontally
    ball.vy = Math.sin(angle) * power; // send ball flying vertically
  }
}

// starts a slide tackle — kicks the ball away and shows a yellow ring
function doTackle(p) {
  if (p.tackling) return; // can't tackle if already tackling
  soundTackle();
  p.tackling = true;    // turn on tackle mode
  p.tackleTimer = 22;   // lasts 22 frames
  const dx   = ball.x - p.x;
  const dy   = ball.y - p.y;
  const dist = Math.hypot(dx, dy);
  if (dist < PLAYER_R*2 + ball.r) { // if ball is close enough
    const angle = Math.atan2(dy, dx);
    ball.vx = Math.cos(angle)*10; // boot the ball away hard
    ball.vy = Math.sin(angle)*10;
  }
}

// counts down tackle timers and ends the tackle when the timer hits zero
function updateTackles() {
  for (const p of players) {
    if (p.tackling) {
      p.tackleTimer--;
      if (p.tackleTimer <= 0) p.tackling = false; // tackle is over
    }
  }
}

// controls all the AI players (bots and goalkeepers)
function updateAI(p) {
  if (p.frozen) return; // do nothing if frozen by powerup
  const D = DIFF[difficulty]; // grab this kinda difficulty's settings
  let tx = p.homeX, ty = p.homeY; // default: go back to starting position

  if (p.role === "gk") {
    // goalkeeper just moves up and down to follow the ball
    p.vy += (ball.y - p.y) * D.gkSpeed; // speed toward ball's height
    p.vy *= 0.85;    // slow down a bit each frame
    p.y  += p.vy;   // move
    p.x   = p.homeX; // stay locked at home x so like they can't leave the goal
    kickBall(p, D.gkKick); // kick if ball is close
    return;
  }

  if (p.role === "fwd") {
    // approach the ball at a slight angle so like they don't get stuck head-on with another player
    const angle = Math.atan2(ball.y-p.y, ball.x-p.x); // direction straight to ball
    const side  = (p.team==="b" ? 1 : -1) * 28;       // offset to the side a little
    tx = ball.x + Math.cos(angle + Math.PI/2) * side;  // target is slightly to the side of the ball
    ty = ball.y + Math.sin(angle + Math.PI/2) * side;
    if (difficulty==="hard" && Math.random()<0.004) doTackle(p); // hard AI randomly tackles
  }

  p.vx += (tx - p.x) * D.aiAccel; // push toward the target
  p.vy += (ty - p.y) * D.aiAccel;
  p.vx *= D.aiFric; // slow down a bit each frame (friction)
  p.vy *= D.aiFric;
  p.x  += p.vx; // actually move
  p.y  += p.vy;
  kickBall(p, D.aiKick); // kick if ball is close
}

// controls P1 (you) using WASD and SPACE and SHIFT
function updateUser(p) {
  const sprinting = keys["shift"] && staminaP1 > 0; // you're sprinting if SHIFT is held and you have stamina
  const mult = sprinting ? SPRINT_MULT : 1; // go faster while sprinting

  if (sprinting) staminaP1 = Math.max(0, staminaP1 - STAMINA_SPRINT);       // drain stamina while sprinting
  else           staminaP1 = Math.min(STAMINA_MAX, staminaP1 + STAMINA_RECOVER); // refill when not sprinting

  if (keys["w"] || keys["arrowup"])    p.vy -= SPEEDS.userAccel * mult; // move up
  if (keys["s"] || keys["arrowdown"])  p.vy += SPEEDS.userAccel * mult; // move down
  if (keys["a"] || keys["arrowleft"])  p.vx -= SPEEDS.userAccel * mult; // move left
  if (keys["d"] || keys["arrowright"]) p.vx += SPEEDS.userAccel * mult; // move right

  const spMult = (powerupEffects.speed && Date.now() < powerupEffects.speed) ? 1.5 : 1; // go even faster if speed powerup is active
  p.vx *= SPEEDS.userFriction; // slow down a bit each frame
  p.vy *= SPEEDS.userFriction;
  const ms = SPEEDS.userMaxSpeed * spMult; // top speed (higher if speed powerup is on)
  p.x += Math.max(-ms, Math.min(ms, p.vx)); // move but cap at max speed
  p.y += Math.max(-ms, Math.min(ms, p.vy));

  if (keys["shift"] && !p.tackling && staminaP1 > 20) doTackle(p); // SHIFT also does a tackle

  if (keys[" "]) { // holding SPACE charges the shot
    p1Charging = true;
    p1Power = Math.min(p1Power + 1.8, 100); // increase charge up to 100
    document.getElementById("powerbar").style.display = "block";
    document.getElementById("powerbar-fill").style.width = p1Power + "%"; // update the bar
  } else if (p1Charging) { // releasing SPACE fires the shot
    const power = SPEEDS.spaceKickPow * (0.5 + p1Power/100 * 0.5); // 50% to 100% of max power
    kickBall(p, power);
    p1Charging = false; p1Power = 0; // reset charge
    document.getElementById("powerbar").style.display = "none";
    document.getElementById("powerbar-fill").style.width = "0%";
  } else {
    kickBall(p, SPEEDS.userKickPow); // normal kick if you just walk into the ball
  }

  document.getElementById("sf1").style.width = staminaP1 + "%"; // update stamina bar width
}

// controls P2 using IJKL and O and P
function updateP2(p) {
  const sprinting = keys["p"] && staminaP2 > 0; // P key sprints
  const mult = sprinting ? SPRINT_MULT : 1;
  if (sprinting) staminaP2 = Math.max(0, staminaP2 - STAMINA_SPRINT);
  else           staminaP2 = Math.min(STAMINA_MAX, staminaP2 + STAMINA_RECOVER);

  if (keys["i"]) p.vy -= SPEEDS.userAccel * mult; // up
  if (keys["k"]) p.vy += SPEEDS.userAccel * mult; // down
  if (keys["j"]) p.vx -= SPEEDS.userAccel * mult; // left
  if (keys["l"]) p.vx += SPEEDS.userAccel * mult; // right

  p.vx *= SPEEDS.userFriction;
  p.vy *= SPEEDS.userFriction;
  const ms = SPEEDS.userMaxSpeed;
  p.x += Math.max(-ms, Math.min(ms, p.vx));
  p.y += Math.max(-ms, Math.min(ms, p.vy));

  if (keys["p"] && !p.tackling && staminaP2 > 20) doTackle(p); // P also tackles

  if (keys["o"]) { // O charges the shot
    p2Charging = true;
    p2Power = Math.min(p2Power + 1.8, 100);
  } else if (p2Charging) { // releasing O fires the shot
    const power = SPEEDS.spaceKickPow * (0.5 + p2Power/100 * 0.5);
    kickBall(p, power);
    p2Charging = false; p2Power = 0;
  } else {
    kickBall(p, SPEEDS.userKickPow); // normal kick on contact
  }
  document.getElementById("sf2").style.width = staminaP2 + "%";
}

let goalCooldown = 0; // prevents scoring multiple goals from one shot

// checks if the ball went into a goal
function checkGoals() {
  if (goalCooldown > 0) { goalCooldown--; return; } // skip if we just scored
  const top = GH()/2 - GOAL_H/2; // top of the goal
  const bot = GH()/2 + GOAL_H/2; // bottom of the goal

  let scorer = null;
  if (ball.x - ball.r < GOAL_W + MARGIN && ball.y > top && ball.y < bot) scorer = "red";  // ball went into the left goal, red scores
  if (ball.x + ball.r > GW()-GOAL_W-MARGIN && ball.y > top && ball.y < bot) scorer = "blue"; // ball went into the right goal, blue scores
  if (!scorer) return; // no goal this kinda frame

  if (scorer==="red")  { scoreRed++;  document.getElementById("score-red").textContent  = scoreRed; }
  if (scorer==="blue") { scoreBlue++; document.getElementById("score-blue").textContent = scoreBlue; }

  soundGoal();
  spawnConfetti(ball.rx, ball.ry); // confetti where the ball is
  showGoalSplash(scorer);          // show big GOAL! text
  resetBall();
  goalCooldown = 120;  // wait 2 seconds before another goal can happen
  gameRunning = false; // pause while celebrating

  setTimeout(() => { // after 1.8 seconds do the kickoff countdown and restart
    doCountdown(() => { gameRunning = true; soundWhistle(); });
  }, 1800);
}

// shows the "GOAL!" text in the scoring team's color
function showGoalSplash(team) {
  const el  = document.getElementById("goal-splash");
  const txt = document.getElementById("goal-text");
  txt.style.color = team==="blue" ? "#4dabf7" : "#ff6b6b"; // blue or red color
  el.style.opacity = "1"; // show it
  setTimeout(() => { el.style.opacity = "0"; }, 1600); // hide it after 1.6 seconds
}

// updates the score numbers shown on screen
function updateScoreHUD() {
  document.getElementById("score-blue").textContent = scoreBlue;
  document.getElementById("score-red").textContent  = scoreRed;
}

let lastSecond = Date.now(); // used to track when the last second ticked

// counts down the match timer every second
function updateTimer() {
  if (!gameRunning) return; // don't count down during countdowns or goal animations
  const now = Date.now();
  if (now - lastSecond >= 1000) { // one full second has passed
    lastSecond = now;
    matchTime--;
    if (matchTime <= 0) {
      matchTime = 0;
      if (scoreBlue !== scoreRed) endMatch(); // someone won
      else { overtime = true; document.getElementById("timer").textContent = "⚡ OVERTIME"; } // tied = overtime
    }
    if (!overtime && matchTime >= 0) {
      const m = Math.floor(matchTime/60); // minutes
      const s = matchTime % 60;           // seconds
      document.getElementById("timer").textContent = m + ":" + (s<10?"0":"") + s; // show like "1:45"
      if (matchTime <= 10) document.getElementById("timer").style.color = "#ff6b6b"; // turn red in last 10 seconds
    }
  }
}

// called when the match ends — shows who won and goes back to the menu
function endMatch() {
  gameRunning = false;
  soundWhistle();
  const winner = scoreBlue > scoreRed ? "BLUE WINS!" : "RED WINS!";
  const el = document.getElementById("goal-text");
  el.textContent = winner;
  el.style.color = scoreBlue > scoreRed ? "#4dabf7" : "#ff6b6b";
  el.style.fontSize = "64px"; // slightly smaller to fit the longer text
  document.getElementById("goal-splash").style.opacity = "1"; // show the overlay
  spawnConfetti(GW()/2, GH()/2); // confetti in the middle
  matchHistory.push({ blue: scoreBlue, red: scoreRed, diff: difficulty }); // save the result

  setTimeout(() => { // after 4 seconds go back to the menu
    document.getElementById("goal-splash").style.opacity = "0";
    el.style.fontSize = "96px";
    el.textContent = "GOAL!"; // reset text for next time
    document.getElementById("difficulty-screen").style.display = "flex"; // show menu again
    document.getElementById("timer").style.color = "#fff"; // reset timer color
  }, 4000);
}

// keeps the ball inside the field by bouncing it off the walls
function clampBall() {
  const minX = MARGIN+ball.r, maxX = GW()-MARGIN-ball.r;
  const minY = MARGIN+ball.r, maxY = GH()-MARGIN-ball.r;
  if(ball.x < minX){ ball.x = minX; ball.vx =  Math.abs(ball.vx)*0.7; } // hit left wall, bounce right (lose 30% speed)
  if(ball.x > maxX){ ball.x = maxX; ball.vx = -Math.abs(ball.vx)*0.7; } // hit right wall, bounce left
  if(ball.y < minY){ ball.y = minY; ball.vy =  Math.abs(ball.vy)*0.7; } // hit top wall, bounce down
  if(ball.y > maxY){ ball.y = maxY; ball.vy = -Math.abs(ball.vy)*0.7; } // hit bottom wall, bounce up
}

// stops a player from walking off the edge of the field
function clampPlayer(p) {
  p.x = Math.max(MARGIN+PLAYER_R, Math.min(GW()-MARGIN-PLAYER_R, p.x)); // keep inside left and right
  p.y = Math.max(MARGIN+PLAYER_R, Math.min(GH()-MARGIN-PLAYER_R, p.y)); // keep inside top and bottom
}

// draws a player circle at their smooth position
function drawPlayer(p) {
  const x = p.rx, y = p.ry; // use smoothed position for drawing

  // dark shadow behind the player so like they look slightly 3D
  ctx.beginPath();
  ctx.ellipse(x+3, y+5, PLAYER_R*0.85, PLAYER_R*0.4, 0, 0, Math.PI*2);
  ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.fill();

  // yellow ring shows when they're doing a tackle
  if (p.tackling) {
    ctx.beginPath(); ctx.arc(x, y, PLAYER_R+6, 0, Math.PI*2);
    ctx.strokeStyle = "rgba(255,220,50,0.85)"; ctx.lineWidth = 3; ctx.stroke();
  }

  // blue ring shows when they're frozen by the powerup
  if (p.frozen) {
    ctx.beginPath(); ctx.arc(x, y, PLAYER_R+5, 0, Math.PI*2);
    ctx.strokeStyle = "rgba(165,216,255,0.9)"; ctx.lineWidth = 4; ctx.stroke();
  }

  // main circle filled with team color
  ctx.beginPath(); ctx.arc(x, y, PLAYER_R, 0, Math.PI*2);
  ctx.fillStyle = p.color; ctx.fill();
  ctx.lineWidth = p.isUser || p.isP2 ? 3 : 2.5; // human players get a thicker border
  ctx.strokeStyle = p.isUser || p.isP2 ? "#fff" : "rgba(255,255,255,0.8)";
  ctx.stroke();

  // small shiny spot to make it look round
  ctx.beginPath();
  ctx.arc(x - PLAYER_R*0.28, y - PLAYER_R*0.28, PLAYER_R*0.38, 0, Math.PI*2);
  ctx.fillStyle = "rgba(255,255,255,0.18)"; ctx.fill();

  // draw the label like "YOU" or "GK" in the center
  ctx.font = "bold 11px Arial"; ctx.textAlign = "center";
  ctx.fillStyle = "#fff"; ctx.fillText(p.label, x, y+4); // +4 moves it down a bit to look centered
}

// draws the ball at its smooth position
function drawBall() {
  const x = ball.rx, y = ball.ry, r = ball.r;

  // shadow below the ball
  ctx.beginPath();
  ctx.ellipse(x+2, y+4, r*0.85, r*0.4, 0, 0, Math.PI*2);
  ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.fill();

  // white ball
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fillStyle = "#fff"; ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = "#222"; ctx.stroke(); // dark outline

  // shiny spot to make it look round
  ctx.beginPath();
  ctx.arc(x - r*0.3, y - r*0.3, r*0.35, 0, Math.PI*2);
  ctx.fillStyle = "rgba(255,255,255,0.6)"; ctx.fill();
}

// draws a ring around a player that shows how much stamina they have left
function drawStaminaRing(p, stamina, color) {
  const pct = stamina / STAMINA_MAX; // 0 to 1
  ctx.beginPath();
  ctx.arc(p.rx, p.ry, PLAYER_R+5, -Math.PI/2, -Math.PI/2 + Math.PI*2*pct); // partial arc starting from top
  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  ctx.globalAlpha = 0.7; // a little see-through
  ctx.stroke();
  ctx.globalAlpha = 1; // reset
}

// the main game loop — runs about 60 times per second
function gameLoop() {
  frameCount++; // keep track of how many frames have run

  if (gameRunning) {
    applyPowerupEffects();     // turn on active powerup effects (big ball, frozen goalies, etc)
    checkPowerupCollisions();  // see if anyone walked over a powerup
    updateTackles();           // count down tackle timers
    updateTimer();             // tick the match clock

    for (const p of players) {
      if      (p.isUser) updateUser(p); // P1 reads keyboard
      else if (p.isP2)   updateP2(p);   // P2 reads IJKL
      else               updateAI(p);   // bots move on their own
      clampPlayer(p); // stop them from going off screen
      p.rx += (p.x - p.rx) * 0.35; // slowly move the drawn position toward the real position (smoothing)
      p.ry += (p.y - p.ry) * 0.35;
    }

    ball.x  += ball.vx;             // move the ball
    ball.y  += ball.vy;
    ball.vx *= SPEEDS.ballFriction; // slow the ball down each frame (rolling friction)
    ball.vy *= SPEEDS.ballFriction;
    clampBall();  // bounce off walls
    checkGoals(); // check if a goal was scored

    // if the ball barely moves for 70 frames, give it a random push so like it doesn't get stuck
    const moved = Math.hypot(ball.x-lastBallX, ball.y-lastBallY);
    if (moved < 0.4) {
      if (++stuckFrames > 70) {
        ball.vx += (Math.random()-0.5) * 5; // random push
        ball.vy += (Math.random()-0.5) * 5;
        stuckFrames = 0;
      }
    } else stuckFrames = 0; // ball is moving so like reset the counter
    lastBallX = ball.x;
    lastBallY = ball.y;

    ball.rx += (ball.x - ball.rx) * 0.30; // smooth the ball's drawn position too
    ball.ry += (ball.y - ball.ry) * 0.30;
    updateTrail(); // save ball position for the trail effect
  }

  updateConfetti(); // update confetti even when the game is paused

  // draw everything
  ctx.clearRect(0, 0, canvas.width, canvas.height); // wipe the canvas
  drawTrail();    // draw the motion trail first (behind everything)
  drawPowerups(); // draw powerup icons
  for (const p of players) drawPlayer(p); // draw all players
  const p1 = players.find(p => p.isUser); // find P1
  const p2 = players.find(p => p.isP2);   // find P2
  if (p1) drawStaminaRing(p1, staminaP1, "#4dabf7"); // blue ring for P1
  if (p2) drawStaminaRing(p2, staminaP2, "#ff6b6b"); // red ring for P2
  drawBall();     // draw ball on top of players
  drawConfetti(); // draw confetti on top of everything

  requestAnimationFrame(gameLoop); // run this kinda function again next frame
}

gameLoop(); // start the loop
</script>
