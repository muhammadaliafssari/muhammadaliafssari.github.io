<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Soccer</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { overflow: hidden; background: #111; font-family: Arial; }

#game {
  position: relative; width: 100vw; height: 100vh; overflow: hidden;
  background: repeating-linear-gradient(90deg, #1b8a3d 0 120px, #2ca84c 120px 240px);
}
.field-border  { position: absolute; inset: 8px; border: 4px solid rgba(255,255,255,0.85); pointer-events: none; }
.center-line   { position: absolute; left: 50%; top: 8px; bottom: 8px; width: 3px; background: rgba(255,255,255,0.85); pointer-events: none; }
.center-circle { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
                 width: 220px; height: 220px; border: 3px solid rgba(255,255,255,0.85); border-radius: 50%; pointer-events: none; }
.goal { position: absolute; top: 50%; transform: translateY(-50%); width: 22px; height: 180px; background: rgba(255,255,255,0.9); pointer-events: none; }
.goal-left  { left: 8px; }
.goal-right { right: 8px; }

#gameCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

/* HUD */
#hud {
  position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
  color: #fff; font-size: 26px; font-weight: bold; letter-spacing: 2px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.6); pointer-events: none; white-space: nowrap;
}
#timer {
  position: absolute; top: 52px; left: 50%; transform: translateX(-50%);
  color: #fff; font-size: 20px; font-weight: bold;
  text-shadow: 0 2px 6px rgba(0,0,0,0.5); pointer-events: none;
}
#controls-hint {
  position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.5); font-size: 12px; pointer-events: none; text-align: center; line-height: 1.6;
}

/* Stamina bars */
#stamina-p1, #stamina-p2 {
  position: absolute; bottom: 44px; height: 7px; border-radius: 4px;
  background: rgba(255,255,255,0.15); overflow: hidden; pointer-events: none;
  width: 120px;
}
#stamina-p1 { left: 20px; }
#stamina-p2 { right: 20px; }
.stamina-fill { height: 100%; border-radius: 4px; transition: width 0.1s; }
#stamina-p1 .stamina-fill { background: #4dabf7; }
#stamina-p2 .stamina-fill { background: #ff6b6b; }

/* Power shot meter */
#powerbar {
  position: absolute; bottom: 58px; left: 50%; transform: translateX(-50%);
  width: 140px; height: 10px; border-radius: 5px;
  background: rgba(255,255,255,0.15); overflow: hidden; pointer-events: none; display: none;
}
#powerbar-fill { height: 100%; border-radius: 5px; background: linear-gradient(90deg,#ffd43b,#ff6b6b); width: 0%; }

/* Goal splash */
#goal-splash {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  pointer-events: none; opacity: 0; transition: opacity 0.15s;
}
#goal-text {
  font-size: 96px; font-weight: 900; letter-spacing: 6px;
  text-shadow: 0 4px 30px rgba(0,0,0,0.7);
  color: #fff;
}

/* Countdown overlay */
#countdown {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  pointer-events: none; opacity: 0;
}
#countdown-text { font-size: 120px; font-weight: 900; color: #fff; text-shadow: 0 4px 30px rgba(0,0,0,0.6); }

/* Difficulty picker */
#difficulty-screen {
  position: absolute; inset: 0; background: rgba(0,0,0,0.82);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; z-index: 10;
}
#difficulty-screen h1 { color: #fff; font-size: 42px; font-weight: 900; letter-spacing: 3px; margin-bottom: 8px; }
#difficulty-screen p  { color: rgba(255,255,255,0.6); font-size: 15px; margin-bottom: 8px; }
.diff-btn {
  padding: 14px 48px; font-size: 20px; font-weight: bold; border: none; border-radius: 8px;
  cursor: pointer; letter-spacing: 1px; transition: transform 0.1s, opacity 0.1s;
}
.diff-btn:hover { transform: scale(1.05); }
.diff-btn.easy   { background: #40c057; color: #fff; }
.diff-btn.medium { background: #fd7e14; color: #fff; }
.diff-btn.hard   { background: #e03131; color: #fff; }

/* P2 controls label */
#p2-label {
  position: absolute; top: 14px; right: 20px;
  color: rgba(255,100,100,0.7); font-size: 12px; pointer-events: none;
}
</style>
</head>
<body>
<div id="game">
  <div class="field-border"></div>
  <div class="center-line"></div>
  <div class="center-circle"></div>
  <div class="goal goal-left"></div>
  <div class="goal goal-right"></div>
  <canvas id="gameCanvas"></canvas>

  <div id="hud">Blue <span id="score-blue">0</span> – <span id="score-red">0</span> Red</div>
  <div id="timer">2:00</div>
  <div id="p2-label">P2: IJKL + O</div>

  <div id="stamina-p1"><div class="stamina-fill" id="sf1"></div></div>
  <div id="stamina-p2"><div class="stamina-fill" id="sf2"></div></div>

  <div id="powerbar"><div id="powerbar-fill"></div></div>

  <div id="goal-splash"><div id="goal-text">GOAL!</div></div>
  <div id="countdown"><div id="countdown-text">3</div></div>

  <div id="controls-hint">
    P1: WASD move · SPACE charge shot · SHIFT slide tackle<br>
    P2: IJKL move · O charge shot · P slide tackle
  </div>

  <!-- Difficulty screen -->
  <div id="difficulty-screen">
    <h1>⚽ SOCCER</h1>
    <p>Choose difficulty</p>
    <button class="diff-btn easy"   onclick="startGame('easy')">EASY</button>
    <button class="diff-btn medium" onclick="startGame('medium')">MEDIUM</button>
    <button class="diff-btn hard"   onclick="startGame('hard')">HARD</button>
  </div>
</div>

<script>
// ─── Canvas ───────────────────────────────────────────────────────────────────
const canvas = document.getElementById("gameCanvas");
const ctx    = canvas.getContext("2d");
function resizeCanvas() { canvas.width = innerWidth; canvas.height = innerHeight; }
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

const GW = () => innerWidth;
const GH = () => innerHeight;

// ─── Audio ────────────────────────────────────────────────────────────────────
const AC = new (window.AudioContext || window.webkitAudioContext)();

function playTone(freq, type, duration, vol = 0.3, delay = 0) {
  const o = AC.createOscillator();
  const g = AC.createGain();
  o.connect(g); g.connect(AC.destination);
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, AC.currentTime + delay);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + delay + duration);
  o.start(AC.currentTime + delay);
  o.stop(AC.currentTime + delay + duration);
}

function soundKick()   { playTone(180, "sine",   0.08, 0.4); playTone(90, "sine", 0.12, 0.2); }
function soundGoal()   {
  [523,659,784,1047].forEach((f,i) => playTone(f,"sine",0.25,0.5,i*0.12));
  playTone(200,"sawtooth",0.6,0.15,0.5);
}
function soundWhistle(){ playTone(1200,"sine",0.3,0.4); playTone(1400,"sine",0.2,0.3,0.25); }
function soundTackle() { playTone(120,"sawtooth",0.12,0.5); }
function soundPowerup(){ [400,600,800].forEach((f,i)=>playTone(f,"sine",0.15,0.4,i*0.08)); }
function soundCountdown(n) { playTone(n===0?880:660,"sine",0.18,0.5); }

// ─── Constants ────────────────────────────────────────────────────────────────
const PLAYER_R   = 22;
const BALL_R     = 11;
const GOAL_W     = 22;
const GOAL_H     = 180;
const MARGIN     = 8;
const MATCH_SECS = 120;
const STAMINA_MAX     = 100;
const STAMINA_SPRINT  = 0.55;
const STAMINA_RECOVER = 0.22;
const SPRINT_MULT     = 1.7;

// ─── Difficulty presets ───────────────────────────────────────────────────────
const DIFF = {
  easy:   { aiAccel: 0.003, aiFric: 0.89, aiKick: 4.5, gkKick: 5,   gkSpeed: 0.05 },
  medium: { aiAccel: 0.006, aiFric: 0.91, aiKick: 6,   gkKick: 7,   gkSpeed: 0.08 },
  hard:   { aiAccel: 0.010, aiFric: 0.93, aiKick: 8,   gkKick: 9,   gkSpeed: 0.12 },
};

let difficulty = "medium";

const SPEEDS = {
  userAccel: 0.42, userMaxSpeed: 5.5, userFriction: 0.88,
  userKickPow: 9,  spaceKickPow: 22,
  ballFriction: 0.984,
};

// ─── Powerup types ────────────────────────────────────────────────────────────
const POWERUP_TYPES = [
  { id: "speed",   label: "⚡ SPEED",   color: "#ffd43b", duration: 5000 },
  { id: "bigball", label: "🔵 BIG BALL",color: "#74c0fc", duration: 6000 },
  { id: "freeze",  label: "❄️ FREEZE GK",color: "#a5d8ff",duration: 5000 },
];

// ─── State ────────────────────────────────────────────────────────────────────
const keys = {};
document.addEventListener("keydown", e => { keys[e.key.toLowerCase()] = true;  if([" ","arrowup","arrowdown","arrowleft","arrowright"].includes(e.key.toLowerCase())) e.preventDefault(); });
document.addEventListener("keyup",   e => { keys[e.key.toLowerCase()] = false; });

let players      = [];
let scoreBlue    = 0, scoreRed = 0;
let matchTime    = MATCH_SECS;
let gameRunning  = false;
let overtime     = false;
let frameCount   = 0;
let stuckFrames  = 0, lastBallX = 0, lastBallY = 0;

// Ball
const ball = { x:0,y:0,vx:0,vy:0,rx:0,ry:0,r:BALL_R };

// Confetti
const confetti = [];

// Powerups on field
let activePowerups = [];
let powerupEffects = {}; // { speed: expiry, bigball: expiry, freeze: expiry }

// Power shot
let p1Power = 0, p1Charging = false;
let p2Power = 0, p2Charging = false;

// Stamina
let staminaP1 = STAMINA_MAX, staminaP2 = STAMINA_MAX;

// Tackle state: { player, timer }
let tackles = [];

// Match history
let matchHistory = [];

// ─── Player factory ───────────────────────────────────────────────────────────
function createPlayer(x, y, role, team, color, label, isUser=false, isP2=false) {
  const p = { x,y,rx:x,ry:y,homeX:x,homeY:y, vx:0,vy:0,
              role,team,color,label,isUser,isP2,
              tackling:false,tackleTimer:0,
              frozen:false };
  players.push(p);
  return p;
}

function spawnPlayers() {
  players = [];
  const cy = GH()/2;
  createPlayer(150,      cy, "user","b","#1971c2","YOU",  true,  false);
  createPlayer(320,      cy, "fwd", "b","#1c7ed6","BOT",  false, false);
  createPlayer(55,       cy, "gk",  "b","#7048e8","GK",   false, false);
  createPlayer(GW()-320, cy, "fwd", "r","#e03131","BOT",  false, false);
  createPlayer(GW()-100, cy, "gk",  "r","#f59f00","GK",   false, false);
  // P2 player (red team controlled)
  createPlayer(GW()-150, cy, "p2",  "r","#c92a2a","P2",   false, true);
}

// ─── Audio unlock ─────────────────────────────────────────────────────────────
document.addEventListener("keydown", () => { if(AC.state==="suspended") AC.resume(); }, {once:true});

// ─── Start game ───────────────────────────────────────────────────────────────
function startGame(diff) {
  difficulty = diff;
  document.getElementById("difficulty-screen").style.display = "none";
  spawnPlayers();
  resetBall();
  scoreBlue = scoreRed = 0;
  matchTime = MATCH_SECS;
  overtime  = false;
  gameRunning = false;
  activePowerups = [];
  powerupEffects = {};
  updateScoreHUD();
  doCountdown(() => {
    gameRunning = true;
    soundWhistle();
    scheduleNextPowerup();
  });
}

// ─── Countdown ────────────────────────────────────────────────────────────────
function doCountdown(cb) {
  const el  = document.getElementById("countdown");
  const txt = document.getElementById("countdown-text");
  let n = 3;
  el.style.opacity = "1";
  soundCountdown(n);
  txt.textContent = n;
  const iv = setInterval(() => {
    n--;
    if (n > 0) { txt.textContent = n; soundCountdown(n); }
    else if (n === 0) { txt.textContent = "GO!"; soundCountdown(0); }
    else { clearInterval(iv); el.style.opacity = "0"; cb(); }
  }, 800);
}

// ─── Reset ball ───────────────────────────────────────────────────────────────
function resetBall() {
  ball.x = ball.rx = GW()/2;
  ball.y = ball.ry = GH()/2;
  ball.vx = ball.vy = 0;
  ball.r = BALL_R;
  trail.length = 0;
}

// ─── Trail ────────────────────────────────────────────────────────────────────
const trail = [];
const TRAIL_MAX = 28;

function updateTrail() {
  trail.unshift({ x: ball.rx, y: ball.ry });
  if (trail.length > TRAIL_MAX) trail.pop();
}

function drawTrail() {
  const speed = Math.hypot(ball.vx, ball.vy);
  if (speed < 0.8) return;
  for (let i = trail.length-1; i >= 0; i--) {
    const t = i / TRAIL_MAX;
    const alpha = (1-t) * 0.65 * Math.min(speed/4,1);
    const r = Math.max(1, ball.r * (1 - t*0.82));
    const red = Math.round(255*(1-t*0.9));
    const grn = Math.round(220*(1-t*0.5));
    ctx.beginPath();
    ctx.arc(trail[i].x, trail[i].y, r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(${red},${grn},255,${alpha.toFixed(3)})`;
    ctx.fill();
  }
  if (trail.length > 0) {
    const g = ctx.createRadialGradient(trail[0].x,trail[0].y,0,trail[0].x,trail[0].y,ball.r*2.5);
    g.addColorStop(0,`rgba(180,230,255,${Math.min(speed/6,0.55).toFixed(3)})`);
    g.addColorStop(1,"rgba(100,180,255,0)");
    ctx.beginPath();
    ctx.arc(trail[0].x,trail[0].y,ball.r*2.5,0,Math.PI*2);
    ctx.fillStyle = g; ctx.fill();
  }
}

// ─── Confetti ─────────────────────────────────────────────────────────────────
function spawnConfetti(cx, cy) {
  const COLORS = ["#ffd43b","#ff6b6b","#74c0fc","#a9e34b","#f783ac","#fff"];
  for (let i = 0; i < 120; i++) {
    const angle = Math.random()*Math.PI*2;
    const speed = 2 + Math.random()*8;
    confetti.push({
      x: cx, y: cy,
      vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed - 4,
      w: 6+Math.random()*8, h: 4+Math.random()*5,
      rot: Math.random()*Math.PI, rotV: (Math.random()-0.5)*0.3,
      color: COLORS[Math.floor(Math.random()*COLORS.length)],
      life: 1, decay: 0.012+Math.random()*0.01
    });
  }
}

function updateConfetti() {
  for (let i = confetti.length-1; i >= 0; i--) {
    const c = confetti[i];
    c.x += c.vx; c.y += c.vy; c.vy += 0.18;
    c.vx *= 0.98; c.rot += c.rotV; c.life -= c.decay;
    if (c.life <= 0) confetti.splice(i,1);
  }
}

function drawConfetti() {
  for (const c of confetti) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.globalAlpha = c.life;
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// ─── Powerups ─────────────────────────────────────────────────────────────────
function scheduleNextPowerup() {
  if (!gameRunning) return;
  setTimeout(() => {
    if (!gameRunning) return;
    const type = POWERUP_TYPES[Math.floor(Math.random()*POWERUP_TYPES.length)];
    const pu = {
      x: 150 + Math.random()*(GW()-300),
      y: 80  + Math.random()*(GH()-160),
      type, pulse: 0
    };
    activePowerups.push(pu);
    scheduleNextPowerup();
  }, 8000 + Math.random()*7000);
}

function checkPowerupCollisions() {
  for (let i = activePowerups.length-1; i >= 0; i--) {
    const pu = activePowerups[i];
    for (const p of players) {
      const dist = Math.hypot(p.x - pu.x, p.y - pu.y);
      if (dist < PLAYER_R + 20) {
        soundPowerup();
        powerupEffects[pu.type.id] = Date.now() + pu.type.duration;
        activePowerups.splice(i,1);
        showPowerupLabel(pu.type.label, pu.x, pu.y);
        break;
      }
    }
  }
}

let powerupLabels = [];
function showPowerupLabel(text, x, y) {
  powerupLabels.push({ text, x, y, life: 1.5 });
}

function drawPowerups() {
  const now = Date.now();
  for (const pu of activePowerups) {
    pu.pulse += 0.07;
    const s = 1 + Math.sin(pu.pulse)*0.12;
    ctx.save();
    ctx.translate(pu.x, pu.y);
    ctx.scale(s,s);
    ctx.beginPath();
    ctx.arc(0,0,20,0,Math.PI*2);
    ctx.fillStyle = pu.type.color;
    ctx.globalAlpha = 0.9;
    ctx.fill();
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.font = "bold 13px Arial";
    ctx.textAlign = "center";
    ctx.fillStyle = "#222";
    ctx.fillText(pu.type.id === "speed" ? "⚡" : pu.type.id === "bigball" ? "●" : "❄", 0, 5);
    ctx.restore();
  }

  // floating labels
  for (let i = powerupLabels.length-1; i >= 0; i--) {
    const lb = powerupLabels[i];
    lb.y -= 0.8; lb.life -= 0.02;
    if (lb.life <= 0) { powerupLabels.splice(i,1); continue; }
    ctx.globalAlpha = Math.min(lb.life, 1);
    ctx.font = "bold 18px Arial";
    ctx.textAlign = "center";
    ctx.fillStyle = "#ffd43b";
    ctx.fillText(lb.text, lb.x, lb.y);
  }
  ctx.globalAlpha = 1;
}

function applyPowerupEffects() {
  const now = Date.now();
  // big ball
  ball.r = (powerupEffects.bigball && now < powerupEffects.bigball) ? BALL_R*2.2 : BALL_R;
  // freeze GK
  for (const p of players) {
    if (p.role === "gk") p.frozen = !!(powerupEffects.freeze && now < powerupEffects.freeze);
  }
}

// ─── Kick ─────────────────────────────────────────────────────────────────────
function kickBall(p, power) {
  const dx = ball.x - p.x, dy = ball.y - p.y;
  const dist = Math.hypot(dx,dy);
  if (dist < PLAYER_R + ball.r + 2) {
    soundKick();
    const angle = Math.atan2(dy,dx) + (Math.random()-0.5)*0.22;
    ball.vx = Math.cos(angle)*power;
    ball.vy = Math.sin(angle)*power;
  }
}

// ─── Tackle ───────────────────────────────────────────────────────────────────
function doTackle(p) {
  if (p.tackling) return;
  soundTackle();
  p.tackling = true; p.tackleTimer = 22;
  const dx = ball.x - p.x, dy = ball.y - p.y;
  const dist = Math.hypot(dx,dy);
  if (dist < PLAYER_R*2 + ball.r) {
    const angle = Math.atan2(dy,dx);
    ball.vx = Math.cos(angle)*10;
    ball.vy = Math.sin(angle)*10;
  }
}

function updateTackles() {
  for (const p of players) {
    if (p.tackling) {
      p.tackleTimer--;
      if (p.tackleTimer <= 0) p.tackling = false;
    }
  }
}

// ─── AI ───────────────────────────────────────────────────────────────────────
function updateAI(p) {
  if (p.frozen) return;
  const D = DIFF[difficulty];
  let tx = p.homeX, ty = p.homeY;

  if (p.role === "gk") {
    p.vy += (ball.y - p.y) * D.gkSpeed;
    p.vy *= 0.85; p.y += p.vy;
    p.x = p.homeX;
    kickBall(p, D.gkKick); return;
  }
  if (p.role === "fwd") {
    const angle = Math.atan2(ball.y-p.y, ball.x-p.x);
    const side  = (p.team==="b"?1:-1)*28;
    tx = ball.x + Math.cos(angle+Math.PI/2)*side;
    ty = ball.y + Math.sin(angle+Math.PI/2)*side;
    // Hard AI occasionally tackles
    if (difficulty==="hard" && Math.random()<0.004) doTackle(p);
  }
  p.vx += (tx-p.x)*D.aiAccel;
  p.vy += (ty-p.y)*D.aiAccel;
  p.vx *= D.aiFric; p.vy *= D.aiFric;
  p.x += p.vx; p.y += p.vy;
  kickBall(p, D.aiKick);
}

// ─── User (P1) ────────────────────────────────────────────────────────────────
function updateUser(p) {
  const sprinting = keys["shift"] && staminaP1 > 0;
  const mult = sprinting ? SPRINT_MULT : 1;

  if (sprinting) staminaP1 = Math.max(0, staminaP1 - STAMINA_SPRINT);
  else           staminaP1 = Math.min(STAMINA_MAX, staminaP1 + STAMINA_RECOVER);

  if (keys["w"]||keys["arrowup"])    p.vy -= SPEEDS.userAccel*mult;
  if (keys["s"]||keys["arrowdown"])  p.vy += SPEEDS.userAccel*mult;
  if (keys["a"]||keys["arrowleft"])  p.vx -= SPEEDS.userAccel*mult;
  if (keys["d"]||keys["arrowright"]) p.vx += SPEEDS.userAccel*mult;

  // Speed powerup
  const spMult = (powerupEffects.speed && Date.now() < powerupEffects.speed) ? 1.5 : 1;
  p.vx *= SPEEDS.userFriction; p.vy *= SPEEDS.userFriction;
  const ms = SPEEDS.userMaxSpeed * spMult;
  p.x += Math.max(-ms, Math.min(ms, p.vx));
  p.y += Math.max(-ms, Math.min(ms, p.vy));

  // Tackle
  if (keys["shift"] && !p.tackling && staminaP1 > 20) doTackle(p);

  // Power shot
  if (keys[" "]) {
    p1Charging = true;
    p1Power = Math.min(p1Power + 1.8, 100);
    document.getElementById("powerbar").style.display = "block";
    document.getElementById("powerbar-fill").style.width = p1Power+"%";
  } else if (p1Charging) {
    const power = SPEEDS.spaceKickPow * (0.5 + p1Power/100 * 0.5);
    kickBall(p, power);
    p1Charging = false; p1Power = 0;
    document.getElementById("powerbar").style.display = "none";
    document.getElementById("powerbar-fill").style.width = "0%";
  } else {
    kickBall(p, SPEEDS.userKickPow);
  }

  document.getElementById("sf1").style.width = staminaP1+"%";
}

// ─── P2 (human) ───────────────────────────────────────────────────────────────
function updateP2(p) {
  const sprinting = keys["p"] && staminaP2 > 0;
  const mult = sprinting ? SPRINT_MULT : 1;
  if (sprinting) staminaP2 = Math.max(0, staminaP2 - STAMINA_SPRINT);
  else           staminaP2 = Math.min(STAMINA_MAX, staminaP2 + STAMINA_RECOVER);

  if (keys["i"]) p.vy -= SPEEDS.userAccel*mult;
  if (keys["k"]) p.vy += SPEEDS.userAccel*mult;
  if (keys["j"]) p.vx -= SPEEDS.userAccel*mult;
  if (keys["l"]) p.vx += SPEEDS.userAccel*mult;

  p.vx *= SPEEDS.userFriction; p.vy *= SPEEDS.userFriction;
  const ms = SPEEDS.userMaxSpeed;
  p.x += Math.max(-ms,Math.min(ms,p.vx));
  p.y += Math.max(-ms,Math.min(ms,p.vy));

  if (keys["p"] && !p.tackling && staminaP2 > 20) doTackle(p);

  if (keys["o"]) {
    p2Charging = true;
    p2Power = Math.min(p2Power+1.8,100);
  } else if (p2Charging) {
    const power = SPEEDS.spaceKickPow*(0.5+p2Power/100*0.5);
    kickBall(p, power);
    p2Charging=false; p2Power=0;
  } else {
    kickBall(p, SPEEDS.userKickPow);
  }
  document.getElementById("sf2").style.width = staminaP2+"%";
}

// ─── Goal / reset ─────────────────────────────────────────────────────────────
let goalCooldown = 0;

function checkGoals() {
  if (goalCooldown > 0) { goalCooldown--; return; }
  const top = GH()/2 - GOAL_H/2, bot = GH()/2 + GOAL_H/2;

  let scorer = null;
  if (ball.x - ball.r < GOAL_W + MARGIN && ball.y > top && ball.y < bot) scorer = "red";
  if (ball.x + ball.r > GW()-GOAL_W-MARGIN && ball.y > top && ball.y < bot) scorer = "blue";
  if (!scorer) return;

  if (scorer==="red")  { scoreRed++;  document.getElementById("score-red").textContent  = scoreRed; }
  if (scorer==="blue") { scoreBlue++; document.getElementById("score-blue").textContent = scoreBlue; }

  soundGoal();
  spawnConfetti(ball.rx, ball.ry);
  showGoalSplash(scorer);
  resetBall();
  goalCooldown = 120;
  gameRunning = false;
  setTimeout(() => {
    doCountdown(() => { gameRunning = true; soundWhistle(); });
  }, 1800);
}

function showGoalSplash(team) {
  const el   = document.getElementById("goal-splash");
  const txt  = document.getElementById("goal-text");
  const colors = { blue:"#4dabf7", red:"#ff6b6b" };
  txt.style.color = colors[team] || "#fff";
  el.style.opacity = "1";
  setTimeout(() => { el.style.opacity = "0"; }, 1600);
}

function updateScoreHUD() {
  document.getElementById("score-blue").textContent = scoreBlue;
  document.getElementById("score-red").textContent  = scoreRed;
}

// ─── Timer ────────────────────────────────────────────────────────────────────
let lastSecond = Date.now();
function updateTimer() {
  if (!gameRunning) return;
  const now = Date.now();
  if (now - lastSecond >= 1000) {
    lastSecond = now;
    matchTime--;
    if (matchTime <= 0) {
      matchTime = 0;
      if (scoreBlue !== scoreRed) {
        endMatch();
      } else {
        overtime = true;
        document.getElementById("timer").textContent = "⚡ OVERTIME";
      }
    }
    if (!overtime && matchTime >= 0) {
      const m = Math.floor(matchTime/60);
      const s = matchTime%60;
      document.getElementById("timer").textContent = m+":"+(s<10?"0":"")+s;
      if (matchTime <= 10) document.getElementById("timer").style.color = "#ff6b6b";
    }
  }
}

function endMatch() {
  gameRunning = false;
  soundWhistle();
  const winner = scoreBlue > scoreRed ? "BLUE WINS!" : "RED WINS!";
  const el = document.getElementById("goal-text");
  el.textContent = winner;
  el.style.color = scoreBlue > scoreRed ? "#4dabf7" : "#ff6b6b";
  el.style.fontSize = "64px";
  document.getElementById("goal-splash").style.opacity = "1";
  spawnConfetti(GW()/2, GH()/2);
  matchHistory.push({ blue: scoreBlue, red: scoreRed, diff: difficulty });
  setTimeout(() => {
    document.getElementById("goal-splash").style.opacity = "0";
    el.style.fontSize = "96px";
    el.textContent = "GOAL!";
    document.getElementById("difficulty-screen").style.display = "flex";
    document.getElementById("timer").style.color = "#fff";
  }, 4000);
}

// ─── Clamping ─────────────────────────────────────────────────────────────────
function clampBall() {
  const minX=MARGIN+ball.r, maxX=GW()-MARGIN-ball.r;
  const minY=MARGIN+ball.r, maxY=GH()-MARGIN-ball.r;
  if(ball.x<minX){ball.x=minX;ball.vx= Math.abs(ball.vx)*0.7;}
  if(ball.x>maxX){ball.x=maxX;ball.vx=-Math.abs(ball.vx)*0.7;}
  if(ball.y<minY){ball.y=minY;ball.vy= Math.abs(ball.vy)*0.7;}
  if(ball.y>maxY){ball.y=maxY;ball.vy=-Math.abs(ball.vy)*0.7;}
}
function clampPlayer(p) {
  p.x=Math.max(MARGIN+PLAYER_R,Math.min(GW()-MARGIN-PLAYER_R,p.x));
  p.y=Math.max(MARGIN+PLAYER_R,Math.min(GH()-MARGIN-PLAYER_R,p.y));
}

// ─── Draw ─────────────────────────────────────────────────────────────────────
function drawPlayer(p) {
  const x=p.rx, y=p.ry;
  const isTackling = p.tackling;

  // Shadow
  ctx.beginPath();
  ctx.ellipse(x+3,y+5,PLAYER_R*0.85,PLAYER_R*0.4,0,0,Math.PI*2);
  ctx.fillStyle="rgba(0,0,0,0.25)"; ctx.fill();

  // Tackle ring
  if (isTackling) {
    ctx.beginPath();
    ctx.arc(x,y,PLAYER_R+6,0,Math.PI*2);
    ctx.strokeStyle="rgba(255,220,50,0.85)"; ctx.lineWidth=3; ctx.stroke();
  }

  // Frozen ring
  if (p.frozen) {
    ctx.beginPath();
    ctx.arc(x,y,PLAYER_R+5,0,Math.PI*2);
    ctx.strokeStyle="rgba(165,216,255,0.9)"; ctx.lineWidth=4; ctx.stroke();
  }

  // Body
  ctx.beginPath(); ctx.arc(x,y,PLAYER_R,0,Math.PI*2);
  ctx.fillStyle=p.color; ctx.fill();
  ctx.lineWidth=p.isUser||p.isP2?3:2.5;
  ctx.strokeStyle=p.isUser||p.isP2?"#fff":"rgba(255,255,255,0.8)";
  ctx.stroke();

  // Shine
  ctx.beginPath();
  ctx.arc(x-PLAYER_R*0.28,y-PLAYER_R*0.28,PLAYER_R*0.38,0,Math.PI*2);
  ctx.fillStyle="rgba(255,255,255,0.18)"; ctx.fill();

  // Label
  ctx.font="bold 11px Arial"; ctx.textAlign="center";
  ctx.fillStyle="#fff"; ctx.fillText(p.label,x,y+4);
}

function drawBall() {
  const x=ball.rx, y=ball.ry, r=ball.r;
  ctx.beginPath();
  ctx.ellipse(x+2,y+4,r*0.85,r*0.4,0,0,Math.PI*2);
  ctx.fillStyle="rgba(0,0,0,0.3)"; ctx.fill();

  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle="#fff"; ctx.fill();
  ctx.lineWidth=1.5; ctx.strokeStyle="#222"; ctx.stroke();

  ctx.beginPath();
  ctx.arc(x-r*0.3,y-r*0.3,r*0.35,0,Math.PI*2);
  ctx.fillStyle="rgba(255,255,255,0.6)"; ctx.fill();
}

// Stamina rings around user players
function drawStaminaRing(p, stamina, color) {
  const pct = stamina / STAMINA_MAX;
  ctx.beginPath();
  ctx.arc(p.rx, p.ry, PLAYER_R+5, -Math.PI/2, -Math.PI/2 + Math.PI*2*pct);
  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  ctx.globalAlpha = 0.7;
  ctx.stroke();
  ctx.globalAlpha = 1;
}

// ─── Main loop ────────────────────────────────────────────────────────────────
function gameLoop() {
  frameCount++;

  if (gameRunning) {
    applyPowerupEffects();
    checkPowerupCollisions();
    updateTackles();
    updateTimer();

    for (const p of players) {
      if      (p.isUser) updateUser(p);
      else if (p.isP2)   updateP2(p);
      else               updateAI(p);
      clampPlayer(p);
      p.rx += (p.x - p.rx)*0.35;
      p.ry += (p.y - p.ry)*0.35;
    }

    ball.x += ball.vx; ball.y += ball.vy;
    ball.vx *= SPEEDS.ballFriction; ball.vy *= SPEEDS.ballFriction;
    clampBall(); checkGoals();

    const moved = Math.hypot(ball.x-lastBallX, ball.y-lastBallY);
    if (moved < 0.4) {
      if (++stuckFrames > 70) {
        ball.vx += (Math.random()-0.5)*5;
        ball.vy += (Math.random()-0.5)*5;
        stuckFrames = 0;
      }
    } else stuckFrames = 0;
    lastBallX = ball.x; lastBallY = ball.y;

    ball.rx += (ball.x-ball.rx)*0.30;
    ball.ry += (ball.y-ball.ry)*0.30;
    updateTrail();
  }

  updateConfetti();

  // ── Render ──
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawTrail();
  drawPowerups();
  for (const p of players) drawPlayer(p);
  // Stamina rings
  const p1 = players.find(p=>p.isUser);
  const p2 = players.find(p=>p.isP2);
  if (p1) drawStaminaRing(p1, staminaP1, "#4dabf7");
  if (p2) drawStaminaRing(p2, staminaP2, "#ff6b6b");
  drawBall();
  drawConfetti();

  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
