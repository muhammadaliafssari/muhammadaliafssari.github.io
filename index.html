<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Soccer</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { overflow: hidden; background: #111; font-family: Arial; }

#game {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: repeating-linear-gradient(90deg, #1b8a3d 0 120px, #2ca84c 120px 240px);
}

.field-border  { position: absolute; inset: 8px; border: 4px solid rgba(255,255,255,0.85); pointer-events: none; }
.center-line   { position: absolute; left: 50%; top: 8px; bottom: 8px; width: 3px; background: rgba(255,255,255,0.85); pointer-events: none; }
.center-circle { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
                 width: 220px; height: 220px; border: 3px solid rgba(255,255,255,0.85); border-radius: 50%; pointer-events: none; }
.goal          { position: absolute; top: 50%; transform: translateY(-50%); width: 22px; height: 180px;
                 background: rgba(255,255,255,0.9); pointer-events: none; }
.goal-left  { left: 8px; }
.goal-right { right: 8px; }

.hud {
  position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
  color: #fff; font-size: 28px; font-weight: bold; letter-spacing: 2px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.5); pointer-events: none;
}

/* Use canvas for smooth rendering instead of DOM elements */
#gameCanvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}

.controls-hint {
  position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.55); font-size: 13px; pointer-events: none;
  letter-spacing: 0.5px;
}
</style>
</head>
<body>
<div id="game">
  <div class="field-border"></div>
  <div class="center-line"></div>
  <div class="center-circle"></div>
  <div class="goal goal-left"></div>
  <div class="goal goal-right"></div>
  <canvas id="gameCanvas"></canvas>
  <div class="hud">Blue <span id="score-blue">0</span> – <span id="score-red">0</span> Red</div>
  <div class="controls-hint">WASD / Arrow keys to move · SPACE to kick</div>
</div>

<script>
// ─── Canvas setup ────────────────────────────────────────────────────────────
const canvas = document.getElementById("gameCanvas");
const ctx    = canvas.getContext("2d");

function resizeCanvas() {
  canvas.width  = innerWidth;
  canvas.height = innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

const GW = () => innerWidth;
const GH = () => innerHeight;

// ─── Constants ───────────────────────────────────────────────────────────────
const PLAYER_R   = 22;    // radius
const BALL_R     = 11;
const GOAL_W     = 22;
const GOAL_H     = 180;
const MARGIN     = 8;

const SPEEDS = {
  userAccel:    0.30,
  userMaxSpeed: 4.0,
  userFriction: 0.88,
  aiAccel:      0.004,
  aiFriction:   0.91,
  aiKickPower:  5.5,
  gkKickPower:  6.5,
  userKickPow:  9,
  spaceKickPow: 12,
  ballFriction: 0.984,
};

// ─── Trail ───────────────────────────────────────────────────────────────────
const TRAIL_MAX = 28;
const trail = [];   // { x, y, age } age 0=newest

// ─── State ───────────────────────────────────────────────────────────────────
const keys    = {};
const players = [];
let scoreBlue = 0;
let scoreRed  = 0;

// Interpolated render positions (smoothed)
const ball = { x: 0, y: 0, vx: 0, vy: 0, rx: 0, ry: 0 };

let stuckFrames = 0;
let lastBallX   = 0;
let lastBallY   = 0;
let frameCount  = 0;

// ─── Input ───────────────────────────────────────────────────────────────────
document.addEventListener("keydown", e => { keys[e.key.toLowerCase()] = true;  e.preventDefault(); });
document.addEventListener("keyup",   e => { keys[e.key.toLowerCase()] = false; });

// ─── Player factory ──────────────────────────────────────────────────────────
function createPlayer(x, y, role, team, color, isUser = false) {
  const p = { x, y, rx: x, ry: y, homeX: x, homeY: y,
              vx: 0, vy: 0, role, team, color, isUser };
  players.push(p);
  return p;
}

function spawnPlayers() {
  const cy = GH() / 2;
  createPlayer(150,      cy, "user", "b", "#1971c2", true);
  createPlayer(320,      cy, "fwd",  "b", "#1971c2");
  createPlayer(55,       cy, "gk",   "b", "#7048e8");
  createPlayer(GW()-320, cy, "fwd",  "r", "#e03131");
  createPlayer(GW()-100, cy, "gk",   "r", "#f59f00");
}

// ─── Physics helpers ─────────────────────────────────────────────────────────
const LERP = 0.18;  // render smoothing factor

function kickBall(p, power) {
  const dx   = ball.x - p.x;
  const dy   = ball.y - p.y;
  const dist = Math.hypot(dx, dy);
  if (dist < PLAYER_R + BALL_R + 2) {
    const angle = Math.atan2(dy, dx) + (Math.random() - 0.5) * 0.22;
    ball.vx = Math.cos(angle) * power;
    ball.vy = Math.sin(angle) * power;
  }
}

// ─── AI ──────────────────────────────────────────────────────────────────────
function updateAI(p) {
  let tx = p.homeX, ty = p.homeY;

  if (p.role === "gk") {
    // Goalie tracks ball vertically, stays near goal
    const targetY = ball.y;
    p.vy += (targetY - p.y) * 0.06;
    p.vy *= 0.85;
    p.y  += p.vy;
    p.x   = p.homeX; // locked horizontally
    kickBall(p, SPEEDS.gkKickPower);
    return;
  }

  if (p.role === "fwd") {
    const angle     = Math.atan2(ball.y - p.y, ball.x - p.x);
    const side      = (p.team === "b" ? 1 : -1) * 28;
    tx = ball.x + Math.cos(angle + Math.PI / 2) * side;
    ty = ball.y + Math.sin(angle + Math.PI / 2) * side;
  }

  p.vx += (tx - p.x) * SPEEDS.aiAccel;
  p.vy += (ty - p.y) * SPEEDS.aiAccel;
  p.vx *= SPEEDS.aiFriction;
  p.vy *= SPEEDS.aiFriction;
  p.x  += p.vx;
  p.y  += p.vy;
  kickBall(p, SPEEDS.aiKickPower);
}

// ─── User ────────────────────────────────────────────────────────────────────
function updateUser(p) {
  if (keys["w"] || keys["arrowup"])    p.vy -= SPEEDS.userAccel;
  if (keys["s"] || keys["arrowdown"])  p.vy += SPEEDS.userAccel;
  if (keys["a"] || keys["arrowleft"])  p.vx -= SPEEDS.userAccel;
  if (keys["d"] || keys["arrowright"]) p.vx += SPEEDS.userAccel;

  p.vx *= SPEEDS.userFriction;
  p.vy *= SPEEDS.userFriction;

  const ms = SPEEDS.userMaxSpeed;
  p.x += Math.max(-ms, Math.min(ms, p.vx));
  p.y += Math.max(-ms, Math.min(ms, p.vy));

  if (keys[" "]) kickBall(p, SPEEDS.spaceKickPow);
  kickBall(p, SPEEDS.userKickPow);
}

// ─── Goal / reset ────────────────────────────────────────────────────────────
function resetBall() {
  ball.x = ball.rx = GW() / 2;
  ball.y = ball.ry = GH() / 2;
  ball.vx = ball.vy = 0;
  trail.length = 0;
}

function checkGoals() {
  const top    = GH() / 2 - GOAL_H / 2;
  const bottom = GH() / 2 + GOAL_H / 2;
  if (ball.x - BALL_R < GOAL_W + MARGIN && ball.y > top && ball.y < bottom) {
    scoreRed++;
    document.getElementById("score-red").textContent = scoreRed;
    resetBall();
  }
  if (ball.x + BALL_R > GW() - GOAL_W - MARGIN && ball.y > top && ball.y < bottom) {
    scoreBlue++;
    document.getElementById("score-blue").textContent = scoreBlue;
    resetBall();
  }
}

// ─── Clamping ────────────────────────────────────────────────────────────────
function clampBall() {
  const minX = MARGIN + BALL_R, maxX = GW() - MARGIN - BALL_R;
  const minY = MARGIN + BALL_R, maxY = GH() - MARGIN - BALL_R;
  if (ball.x < minX) { ball.x = minX; ball.vx =  Math.abs(ball.vx) * 0.7; }
  if (ball.x > maxX) { ball.x = maxX; ball.vx = -Math.abs(ball.vx) * 0.7; }
  if (ball.y < minY) { ball.y = minY; ball.vy =  Math.abs(ball.vy) * 0.7; }
  if (ball.y > maxY) { ball.y = maxY; ball.vy = -Math.abs(ball.vy) * 0.7; }
}

function clampPlayer(p) {
  p.x = Math.max(MARGIN + PLAYER_R, Math.min(GW() - MARGIN - PLAYER_R, p.x));
  p.y = Math.max(MARGIN + PLAYER_R, Math.min(GH() - MARGIN - PLAYER_R, p.y));
}

// ─── Trail ───────────────────────────────────────────────────────────────────
function updateTrail() {
  // Add current ball center every frame
  trail.unshift({ x: ball.rx, y: ball.ry });
  if (trail.length > TRAIL_MAX) trail.pop();
}

function drawTrail() {
  const speed = Math.hypot(ball.vx, ball.vy);
  if (speed < 0.8) return;

  for (let i = trail.length - 1; i >= 0; i--) {
    const t     = i / TRAIL_MAX;           // 0=newest tip, 1=oldest tail
    const alpha = (1 - t) * 0.65 * Math.min(speed / 4, 1);
    const r     = Math.max(1, BALL_R * (1 - t * 0.82));

    // colour shifts: white → cyan → electric blue
    const red   = Math.round(255 * (1 - t * 0.9));
    const green = Math.round(220 * (1 - t * 0.5));
    const blue  = 255;

    ctx.beginPath();
    ctx.arc(trail[i].x, trail[i].y, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${red},${green},${blue},${alpha.toFixed(3)})`;
    ctx.fill();
  }

  // Glow at the tip
  if (trail.length > 0) {
    const g = ctx.createRadialGradient(
      trail[0].x, trail[0].y, 0,
      trail[0].x, trail[0].y, BALL_R * 2.5
    );
    g.addColorStop(0, `rgba(180,230,255,${Math.min(speed / 6, 0.55).toFixed(3)})`);
    g.addColorStop(1, "rgba(100,180,255,0)");
    ctx.beginPath();
    ctx.arc(trail[0].x, trail[0].y, BALL_R * 2.5, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
  }
}

// ─── Drawing ─────────────────────────────────────────────────────────────────
function drawPlayer(p) {
  const x = p.rx, y = p.ry;

  // Shadow
  ctx.beginPath();
  ctx.ellipse(x + 3, y + 5, PLAYER_R * 0.85, PLAYER_R * 0.4, 0, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.fill();

  // Body
  ctx.beginPath();
  ctx.arc(x, y, PLAYER_R, 0, Math.PI * 2);
  ctx.fillStyle = p.color;
  ctx.fill();

  // White border
  ctx.lineWidth = p.isUser ? 3 : 2.5;
  ctx.strokeStyle = p.isUser ? "#fff" : "rgba(255,255,255,0.85)";
  ctx.stroke();

  // Highlight shine
  ctx.beginPath();
  ctx.arc(x - PLAYER_R * 0.28, y - PLAYER_R * 0.28, PLAYER_R * 0.38, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,255,255,0.18)";
  ctx.fill();
}

function drawBall() {
  const x = ball.rx, y = ball.ry;

  // Shadow
  ctx.beginPath();
  ctx.ellipse(x + 2, y + 4, BALL_R * 0.85, BALL_R * 0.4, 0, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.fill();

  // Ball body
  ctx.beginPath();
  ctx.arc(x, y, BALL_R, 0, Math.PI * 2);
  ctx.fillStyle = "#fff";
  ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = "#222";
  ctx.stroke();

  // Shine
  ctx.beginPath();
  ctx.arc(x - BALL_R * 0.3, y - BALL_R * 0.3, BALL_R * 0.35, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.fill();
}

// ─── Main loop ───────────────────────────────────────────────────────────────
function gameLoop() {
  frameCount++;

  // ── Physics update ──
  for (const p of players) {
    if (p.isUser) updateUser(p);
    else          updateAI(p);
    clampPlayer(p);
    // Smooth render position toward physics position
    p.rx += (p.x - p.rx) * 0.35;
    p.ry += (p.y - p.ry) * 0.35;
  }

  ball.x  += ball.vx;
  ball.y  += ball.vy;
  ball.vx *= SPEEDS.ballFriction;
  ball.vy *= SPEEDS.ballFriction;
  clampBall();
  checkGoals();

  // Stuck-ball detector
  const moved = Math.hypot(ball.x - lastBallX, ball.y - lastBallY);
  if (moved < 0.4) {
    if (++stuckFrames > 70) {
      ball.vx += (Math.random() - 0.5) * 5;
      ball.vy += (Math.random() - 0.5) * 5;
      stuckFrames = 0;
    }
  } else { stuckFrames = 0; }
  lastBallX = ball.x;
  lastBallY = ball.y;

  // Smooth ball render position
  ball.rx += (ball.x - ball.rx) * 0.30;
  ball.ry += (ball.y - ball.ry) * 0.30;

  updateTrail();

  // ── Render ──
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawTrail();
  for (const p of players) drawPlayer(p);
  drawBall();

  requestAnimationFrame(gameLoop);
}

// ─── Init ────────────────────────────────────────────────────────────────────
function init() {
  spawnPlayers();
  resetBall();
  gameLoop();
}

init();
</script>
</body>
</html>
