<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ultimate Soccer Game</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{overflow:hidden;background:#111}

#game{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;
background:repeating-linear-gradient(90deg,#1b8a3d 0 120px,#2ca84c 120px 240px)
}

#game:after{
content:"";
position:absolute;
inset:0;
border:8px solid #fff;
pointer-events:none;
}

.center-line{position:absolute;left:50%;top:0;width:4px;height:100%;background:#fff}
.center-circle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
width:220px;height:220px;border:4px solid #fff;border-radius:50%}

.goal{position:absolute;top:50%;transform:translateY(-50%);width:22px;height:280px;background:#fff}
.left-goal{left:0}.right-goal{right:0}

.player,.cpu,.goalie,#ball{position:absolute;border-radius:50%}

.player{width:80px;height:80px;background:#1971c2;border:4px solid #fff}
.cpu{width:80px;height:80px;background:#e03131;border:4px solid #fff}

.goalie{width:70px;height:70px;border:4px solid #fff}
.left-goalie{background:#7048e8}
.right-goalie{background:#f59f00}

#ball{
width:42px;height:42px;
background:radial-gradient(circle at 30% 30%,#fff,#ccc);
border:2px solid #000
}

.hud{
position:absolute;top:12px;width:100%;
display:flex;justify-content:center;gap:50px;
color:#fff;font-size:34px;font-weight:bold;
}

.barwrap{
position:absolute;left:20px;width:240px;height:18px;
background:#333;border:2px solid #fff;border-radius:10px;
overflow:hidden;
}

#staminaWrap{top:20px}
#powerWrap{top:48px}

#stamina{background:lime;height:100%;width:100%}
#power{background:orange;height:100%;width:0%}

#timer{
position:absolute;right:20px;top:20px;
color:#fff;font-size:28px;font-weight:bold;
}

#winner{
display:none;
position:absolute;inset:0;
background:rgba(0,0,0,.85);
color:#fff;
align-items:center;
justify-content:center;
flex-direction:column;
gap:20px;
}

button{padding:12px 24px;font-size:20px}
</style>
</head>

<body>

<div id="game">
<div class="center-line"></div>
<div class="center-circle"></div>

<div class="goal left-goal"></div>
<div class="goal right-goal"></div>

<div class="hud">
PLAYER <span id="ps">0</span>
CPU <span id="cs">0</span>
</div>

<div id="timer">180</div>

<div id="staminaWrap" class="barwrap"><div id="stamina"></div></div>
<div id="powerWrap" class="barwrap"><div id="power"></div></div>

<div id="player" class="player"></div>
<div id="cpu" class="cpu"></div>

<div id="lg" class="goalie left-goalie"></div>
<div id="rg" class="goalie right-goalie"></div>

<div id="ball"></div>

<div id="winner">
<h1 id="winnerText"></h1>
<button onclick="location.reload()">Play Again</button>
</div>
</div>

<script>
const g=id=>document.getElementById(id);
const game=g("game"),playerEl=g("player"),cpuEl=g("cpu"),ballEl=g("ball");

const keys={};
addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

let px=150,py=300,pvx=0,pvy=0;
let cx=1000,cy=300,cvx=0,cvy=0;

let bx=600,by=300,bvx=0,bvy=0;

let stamina=100,power=0,spacePrev=false;
let ps=0,cs=0,time=180,ended=false;

function rect(){return game.getBoundingClientRect();}

function reset(){
const r=rect();
bx=r.width/2; by=r.height/2;
bvx=bvy=0;
px=150; py=r.height/2;
cx=r.width-220; cy=r.height/2;
}

reset();

setInterval(()=>{
if(ended) return;
time--;
g("timer").textContent=time;
if(time<=0){
ended=true;
g("winner").style.display="flex";
g("winnerText").textContent=ps>cs?"YOU WIN!":cs>ps?"CPU WINS!":"DRAW!";
}
},1000);

function collide(x,y,r,str){
const dx=(bx+21)-(x+r/2);
const dy=(by+21)-(y+r/2);
const d=Math.hypot(dx,dy);
const min=r/2+21;

if(d<min){
const a=Math.atan2(dy,dx);
const overlap=min-d;
bx+=Math.cos(a)*overlap;
by+=Math.sin(a)*overlap;
bvx=Math.cos(a)*str;
bvy=Math.sin(a)*str;
}
}

/* ================= FIXED BALL WALL PHYSICS ================= */
function ballWalls(){
const BALL=42;
const BORDER=8;

// X axis
if(bx <= BORDER){
bx = BORDER;
bvx = Math.abs(bvx) * 0.9;
}
else if(bx >= rect().width - BALL - BORDER){
bx = rect().width - BALL - BORDER;
bvx = -Math.abs(bvx) * 0.9;
}

// Y axis
if(by <= BORDER){
by = BORDER;
bvy = Math.abs(bvy) * 0.9;
}
else if(by >= rect().height - BALL - BORDER){
by = rect().height - BALL - BORDER;
bvy = -Math.abs(bvy) * 0.9;
}
}

/* ================= PLAYER + CPU WALL BOUNCE ================= */
function bounceEntity(x,y,vx,vy,size){

const BORDER=8;
const w=rect().width;
const h=rect().height;

if(x <= BORDER){
x=BORDER;
vx=Math.abs(vx)*0.5;
}
else if(x >= w-size-BORDER){
x=w-size-BORDER;
vx=-Math.abs(vx)*0.5;
}

if(y <= BORDER){
y=BORDER;
vy=Math.abs(vy)*0.5;
}
else if(y >= h-size-BORDER){
y=h-size-BORDER;
vy=-Math.abs(vy)*0.5;
}

return {x,y,vx,vy};
}

function loop(){
if(!ended){

const w=rect().width;
const h=rect().height;

const SIZE=80;

/* PLAYER */
let max=5;
if(keys["shift"]&&stamina>0){max=7; stamina-=0.8;}
else stamina=Math.min(100,stamina+0.3);

if(keys["w"])pvy-=0.5;
if(keys["s"])pvy+=0.5;
if(keys["a"])pvx-=0.5;
if(keys["d"])pvx+=0.5;

pvx=Math.max(-max,Math.min(max,pvx));
pvy=Math.max(-max,Math.min(max,pvy));

px+=pvx;
py+=pvy;

let p=bounceEntity(px,py,pvx,pvy,SIZE);
px=p.x; py=p.y; pvx=p.vx; pvy=p.vy;

/* SHOOT */
if(keys[" "]){
power=Math.min(100,power+2);
}else{
power=Math.max(0,power-1);
}

if(spacePrev && !keys[" "]){
const ang=Math.atan2(by-py,bx-px);
bvx=Math.cos(ang)*(8+power/5);
bvy=Math.sin(ang)*(8+power/5);
power=0;
}
spacePrev=!!keys[" "];

/* CPU */
const dx=bx-cx,dy=by-cy;
const dist=Math.hypot(dx,dy)||1;

cvx+=(dx/dist)*0.4;
cvy+=(dy/dist)*0.4;

cvx*=0.92;
cvy*=0.92;

cx+=cvx;
cy+=cvy;

let c=bounceEntity(cx,cy,cvx,cvy,SIZE);
cx=c.x; cy=c.y; cvx=c.vx; cvy=c.vy;

/* BALL MOVE */
bx+=bvx;
by+=bvy;

bvx*=0.985;
bvy*=0.985;

const gt=h/2-140;
const gb=h/2+140;

/* GOALIES */
let lgy=Math.max(gt,Math.min(gb-70,by-35));
let rgy=Math.max(gt,Math.min(gb-70,by-35));

collide(px,py,80,10+power/5);
collide(cx,cy,80,10);
collide(60,lgy,70,12);
collide(w-130,rgy,70,12);

/* BALL WALLS (FIXED CORNERS) */
ballWalls();

/* GOALS */
if(bx<=8 && by>gt && by<gb){
cs++; g("cs").textContent=cs;
reset();
}
if(bx>=w-42 && by>gt && by<gb){
ps++; g("ps").textContent=ps;
reset();
}

/* DRAW */
playerEl.style.left=px+"px";
playerEl.style.top=py+"px";

cpuEl.style.left=cx+"px";
cpuEl.style.top=cy+"px";

ballEl.style.left=bx+"px";
ballEl.style.top=by+"px";

g("stamina").style.width=stamina+"%";
g("power").style.width=power+"%";
}

requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
